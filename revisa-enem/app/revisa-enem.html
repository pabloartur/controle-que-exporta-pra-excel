/* ---------- Aula narrada ---------- */
const NATIVE_TTS=!!window.AndroidTTS;
const WEB_TTS=('speechSynthesis' in window)&&typeof SpeechSynthesisUtterance!=='undefined';
const TTS=NATIVE_TTS||WEB_TTS;
const TTSCB={}; let ttsSeq=0;
window.__ttsDone=function(id,ok){const f=TTSCB[id]; if(f){delete TTSCB[id]; f(ok);}};
let VOICE=null;
function pickVoice(){try{const vs=speechSynthesis.getVoices()||[];VOICE=vs.find(v=>/^pt[-_]BR/i.test(v.lang))||vs.find(v=>/^pt/i.test(v.lang))||null}catch(e){}}
if(WEB_TTS&&!NATIVE_TTS){pickVoice();try{speechSynthesis.addEventListener('voiceschanged',pickVoice)}catch(e){speechSynthesis.onvoiceschanged=pickVoice}}
const RATES=[1,1.25,1.5,0.75];
const P={t:null,i:0,playing:false,ended:false,started:false,chunks:[],ci:0,token:0,timer:null,fails:0,wake:null};

function speakable(s){
  let txt=s.n?s.n:strip(s.p.replace(/<br\s*\/?>/gi,'. ').replace(/<\/div>/gi,'. ').replace(/<div[^>]*>/gi,'. '));
  txt=(s.h+'. '+txt)
    .replace(/·/g,', ').replace(/→/g,', ')
    .replace(/×/g,' vezes ').replace(/÷/g,' dividido por ')
    .replace(/\s=\s/g,' igual a ').replace(/=/g,' igual a ')
    .replace(/\s\+\s/g,' mais ').replace(/\s[−-]\s/g,', ')
    .replace(/²/g,' ao quadrado').replace(/³/g,' ao cubo').replace(/ᵗ/g,' elevado a t')
    .replace(/π/g,' pi ').replace(/₁/g,'1').replace(/₂/g,'2').replace(/₄/g,'4')
    .replace(/(\d+)\/(\d+)/g,'$1 sobre $2')
    .replace(/["“”]/g,'')
    .replace(/\.\s*\./g,'.').replace(/\s+/g,' ').trim();
  const parts=txt.split(/(?<=[.!?;:])\s+/).filter(x=>x.replace(/[.,;:\s]/g,'').length);
  return parts.length?parts:[txt];
}
function readMs(text){return Math.max(1800,text.split(/\s+/).length*390/P.rate)}

function viewTopic(tid){
  const t=TMAP[tid]; if(!t) return viewHome();
  const a=AMAP[t.area]; S.last=t.id; save();
  const ids=topicQids(t); const done=ids.filter(i=>S.done[i]!==undefined).length; const ok=ids.filter(i=>S.done[i]===1).length;
  app.innerHTML=`
  <a class="back" href="#area-${a.id}">← ${a.nome}</a>
  <header class="thead"><span class="chip" data-a="${a.id}">${a.sigla}</span><h1>${t.nome}</h1><p class="why">${t.porque}</p></header>
  ${videoBlock(t)}
  <section class="player" aria-label="Resumo narrado">
    <h2 class="sec">Resumo narrado</h2>
    <div class="screen">
      <div class="scr-top"><span id="scrPart"></span><span id="scrMode"></span></div>
      <div class="slide" id="slide" aria-live="polite"></div>
    </div>
    <div class="segs" id="segs">${t.aula.map((_,i)=>`<button class="seg" data-i="${i}" aria-label="Ir para a parte ${i+1}"><i></i></button>`).join('')}</div>
    <div class="controls">
      <button class="ctl" id="pPrev" aria-label="Parte anterior">${IC.prev}</button>
      <button class="ctl play" id="pPlay"></button>
      <button class="ctl" id="pNext" aria-label="Próxima parte">${IC.next}</button>
      <button class="ctl" id="pRate" aria-label="Velocidade da narração"></button>
      <button class="ctl" id="pMute"></button>
    </div>
    <p class="hint" id="pHint">${TTS?'O resumo é narrado pela voz do aparelho e avança sozinho. Toque nas barrinhas para pular partes.':'Este navegador não tem voz disponível. O resumo avança sozinho, só com o texto.'}</p>
  </section>
  <section class="next-step">
    <a class="btn primary" href="#questoes-${t.id}">Fazer as ${ids.length} questões</a>
    <span class="status">${done?`Última tentativa: ${ok} de ${ids.length} certas`:'Questões ainda não respondidas'}</span>
  </section>
  <details class="resumo"><summary>Ler o resumo em texto</summary><div class="rs">${t.aula.map(s=>`<h3>${s.h}</h3><div>${s.p}</div>`).join('')}</div></details>`;

  P.t=t; P.i=0; P.playing=false; P.ended=false; P.started=false; P.fails=0;
  if(!TTS) S.muted=true;
  document.getElementById('pPlay').addEventListener('click',()=>P.playing?pause():play());
  document.getElementById('pPrev').addEventListener('click',()=>jump(P.i-1));
  document.getElementById('pNext').addEventListener('click',()=>jump(P.i+1));
  document.getElementById('pRate').addEventListener('click',()=>{
    S.rate=RATES[(RATES.indexOf(S.rate)+1)%RATES.length]||1; P.rate=S.rate; save();
    if(P.playing){stopSpeech();resumeSpeaking()} ui();
  });
  document.getElementById('pMute').addEventListener('click',()=>{
    if(!TTS) return; S.muted=!S.muted; save();
    if(P.playing){stopSpeech();resumeSpeaking()} ui();
  });
  document.querySelectorAll('.seg').forEach(b=>b.addEventListener('click',()=>jump(+b.dataset.i)));
  P.rate=S.rate||1;
  goSlide(0);
}

function goSlide(i){
  const t=P.t; if(!t) return;
  P.i=Math.max(0,Math.min(t.aula.length-1,i)); P.chunks=speakable(t.aula[P.i]); P.ci=0; P.ended=false;
  const s=t.aula[P.i]; const el=document.getElementById('slide');
  el.innerHTML=`<h2>${s.h}</h2><div class="sbody">${s.p}</div>`;
  el.classList.remove('enter'); void el.offsetWidth; el.classList.add('enter');
  if(P.i===t.aula.length-1){S.seen[t.id]=1; save();}
  ui();
}
function ui(){
  const t=P.t; if(!t) return;
  const part=document.getElementById('scrPart'); if(!part) return;
  part.textContent=P.ended?'Fim do resumo':`Parte ${P.i+1} de ${t.aula.length}`;
  document.getElementById('scrMode').textContent=P.playing?(S.muted?'Lendo sem voz':'Narrando'):'';
  const play=document.getElementById('pPlay');
  play.innerHTML=P.playing?`${IC.pause}<span>Pausar</span>`:P.ended?`${IC.again}<span>Ouvir de novo</span>`:`${IC.play}<span>${P.started?'Continuar':'Ouvir resumo'}</span>`;
  document.getElementById('pPrev').disabled=P.i===0&&!P.ended;
  document.getElementById('pNext').disabled=P.i>=t.aula.length-1||P.ended;
  document.getElementById('pRate').textContent=String(P.rate).replace('.',',')+'x';
  const m=document.getElementById('pMute');
  m.textContent=S.muted?'Sem voz':'Com voz'; m.setAttribute('aria-pressed',S.muted?'true':'false'); m.disabled=!TTS;
  m.setAttribute('aria-label',S.muted?'Ligar a voz da narração':'Desligar a voz e só ler');
  document.querySelectorAll('.seg i').forEach((el,k)=>{
    const p=P.ended||k<P.i?100:k===P.i?Math.round(P.ci/Math.max(1,P.chunks.length)*100):0;
    el.style.setProperty('--p',p+'%');
  });
}
function stopSpeech(){P.token++; clearTimeout(P.timer); for(const k in TTSCB) delete TTSCB[k];
  if(NATIVE_TTS){try{AndroidTTS.stop()}catch(e){}} else if(WEB_TTS){try{speechSynthesis.cancel()}catch(e){}}}
function resumeSpeaking(){const tok=++P.token; clearTimeout(P.timer); P.timer=setTimeout(()=>speakChunk(tok),90)}
function play(){
  if(!P.t) return;
  if(P.ended){goSlide(0)}
  P.playing=true; P.started=true; ui(); wakeOn(); resumeSpeaking();
}
function pause(){P.playing=false; stopSpeech(); wakeOff(); ui()}
function jump(i){
  if(!P.t) return;
  const was=P.playing; stopSpeech(); goSlide(i);
  if(was){P.playing=true; resumeSpeaking()}
  ui();
}
function finish(){
  P.playing=false; P.ended=true; wakeOff();
  const t=P.t; S.seen[t.id]=1; save();
  const el=document.getElementById('slide');
  el.innerHTML=`<div class="endcard"><h2>Resumo concluído</h2><p class="sbody">Agora teste o que aprendeu com ${t.qs.length} questões no estilo ENEM.</p><a class="btn" href="#questoes-${t.id}">Fazer as questões</a></div>`;
  el.classList.remove('enter'); void el.offsetWidth; el.classList.add('enter');
  ui();
}
function speakChunk(tok){
  if(tok!==P.token||!P.playing||!P.t) return;
  ui();
  if(P.ci>=P.chunks.length){
    if(P.i>=P.t.aula.length-1){finish(); return}
    P.timer=setTimeout(()=>{ if(tok!==P.token) return; goSlide(P.i+1); const nt=++P.token; speakChunk(nt); },650);
    return;
  }
  const text=P.chunks[P.ci]; let done=false;
  const next=()=>{ if(done) return; done=true; clearTimeout(P.timer); if(tok!==P.token) return; P.ci++; speakChunk(tok); };
  const fallback=()=>{ if(tok!==P.token||done) return; clearTimeout(P.timer); P.timer=setTimeout(next,readMs(text));
    P.fails++; if(P.fails>=2&&!S.muted){S.muted=true; save(); const h=document.getElementById('pHint'); if(h) h.textContent='A voz não funcionou neste aparelho, então o resumo segue só com o texto. Toque em "Sem voz" para tentar de novo.'; ui();} };
  if(NATIVE_TTS&&!S.muted){
    const uid='u'+(++ttsSeq); const t0=Date.now(); let started=false;
    TTSCB[uid]=(ok)=>{ if(!ok||Date.now()-t0<Math.min(700,text.length*20)) fallback(); else {P.fails=0; next();} };
    try{ started=!!AndroidTTS.speak(text,P.rate,uid); }catch(e){ started=false; }
    if(started) P.timer=setTimeout(next,3000+text.length*160/P.rate);
    else { delete TTSCB[uid]; fallback(); }
  }else if(WEB_TTS&&!S.muted){
    try{
      const u=new SpeechSynthesisUtterance(text); u.lang='pt-BR'; if(VOICE) u.voice=VOICE; u.rate=P.rate;
      const t0=Date.now();
      u.onend=()=>{ if(Date.now()-t0<Math.min(700,text.length*20)) fallback(); else {P.fails=0; next();} };
      u.onerror=(e)=>{ if(e&&(e.error==='interrupted'||e.error==='canceled')) return; fallback(); };
      speechSynthesis.speak(u);
      P.timer=setTimeout(next,3000+text.length*160/P.rate);
    }catch(e){P.timer=setTimeout(next,readMs(text))}
  }else{
    P.timer=setTimeout(next,readMs(text));
  }
}
async function wakeOn(){try{if('wakeLock' in navigator&&!P.wake){P.wake=await navigator.wakeLock.request('screen')}}catch(e){P.wake=null}}
function wakeOff(){try{P.wake&&P.wake.release()}catch(e){} P.wake=null}
function stopPlayer(){if(P.t){P.playing=false; stopSpeech(); wakeOff(); P.t=null}}
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&P.playing) pause(); });

/* ---------- Questões ---------- */
let Q=null;
function startQuiz(kind,tid){
  let list,title,back,timed=false;
  if(kind==='dia'){
    const seed=tid.modo==='hoje'?hojeSeed():Math.floor(Math.random()*1e9);
    list=montarLista(tid.dia,tid.n,seed); timed=true; back={href:'#',label:'Início'};
    title=`${tid.dia}º dia · ${tid.modo==='hoje'?'questões de hoje':'sorteio novo'}`;
  }else if(kind==='enemdia'){
    list=shuffle(ALLQ.filter(q=>q.m&&DIAS[tid].includes(q.topic.area)).map(q=>q.id)).slice(0,S.pref.n||10);
    title=`${tid}º dia · modelo ENEM`; back={href:'#',label:'Início'}; timed=true;
  }else if(kind==='t'){
    const t=TMAP[tid]; if(!t) return viewHome();
    list=topicQids(t); title=t.nome; back={href:'#aula-'+t.id,label:'Aula: '+t.nome}; S.last=t.id; save();
  }else if(kind==='enem'){
    list=shuffle(ALLQ.filter(q=>q.m).map(q=>q.id)).slice(0,10); title='Simulado modelo ENEM'; back={href:'#',label:'Início'}; timed=true;
  }else if(kind==='sim'){
    list=shuffle(ALLQ.map(q=>q.id)).slice(0,10); title='Simulado rápido'; back={href:'#',label:'Início'};
  }else{
    list=Object.keys(S.done).filter(k=>S.done[k]===0&&getQ(k)); title='Revisar erros'; back={href:'#',label:'Início'};
    if(!list.length){
      app.innerHTML=`<a class="back" href="#">← Início</a><div class="empty"><h1>Nenhum erro para revisar</h1><p>As questões que você errar aparecem aqui, para você tentar de novo até acertar.</p><a class="btn primary" href="#dia${S.pref.dia}-${S.pref.n}-hoje">Fazer as questões de hoje</a></div>`;
      return;
    }
    list=shuffle(list);
  }
  if(!list.length){ app.innerHTML=`<a class="back" href="#">← Início</a><div class="empty"><h1>Sem questões para esta escolha</h1><p>Tente outro dia de prova ou outra quantidade.</p></div>`; return; }
  Q={kind,tid,list,i:0,res:[],title,back,timed,t0:Date.now()};
  renderQuestion();
}
function renderQuestion(){
  const q=getQ(Q.list[Q.i]); const a=AMAP[q.topic.area];
  Q.perm=shuffle([0,1,2,3,4]);
  app.innerHTML=`
  <a class="back" href="${Q.back.href}">← ${Q.back.label}</a>
  <div class="qhead"><span class="chip" data-a="${a.id}">${a.sigla}</span>${q.m?'<span class="tag">Modelo ENEM</span>':''}${q.gen?'<span class="tag">Números novos</span>':''}<span>${q.topic.nome}</span><span class="count">${Q.timed?'<span class="timer" id="timer">00:00</span> · ':''}Questão ${Q.i+1} de ${Q.list.length}</span></div>
  <div class="qbar" aria-hidden="true"><i style="width:${Q.i/Q.list.length*100}%"></i></div>
  <article class="question">
    <div class="enun">${q.q}</div>
    <ol class="opts">${Q.perm.map((orig,j)=>`<li><button class="opt" data-j="${j}"><span class="bub">${L[j]}</span><span class="otext">${q.o[orig]}</span></button></li>`).join('')}</ol>
    <div class="feedback" id="fb" hidden></div>
  </article>`;
  app.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>answer(+b.dataset.j)));
  if(Q.timed) startTimer();
  window.scrollTo(0,0);
}
function answer(j){
  if(Q.res.length>Q.i) return;
  const q=getQ(Q.list[Q.i]); const c=Q.perm.indexOf(q.a); const ok=j===c;
  Q.res.push({id:q.id,j,c,ok}); S.done[q.id]=ok?1:0;
  S.total=(S.total||0)+1; if(ok) S.acertos=(S.acertos||0)+1;
  const hj=hojeStr(); if(S.dias[S.dias.length-1]!==hj){S.dias.push(hj); if(S.dias.length>400) S.dias=S.dias.slice(-400);}
  save();
  app.querySelectorAll('.opt').forEach(b=>{
    const k=+b.dataset.j; b.disabled=true;
    if(k===c) b.classList.add('is-right'); else if(k===j) b.classList.add('is-wrong');
  });
  const last=Q.i===Q.list.length-1;
  const fb=document.getElementById('fb');
  fb.innerHTML=`<div class="fb ${ok?'ok':'bad'}"><strong>${ok?'Resposta certa!':'Não foi dessa vez.'}</strong>${ok?'':`<p>A resposta certa é a letra ${L[c]}.</p>`}<p><b>Resolução:</b> ${q.e}</p></div><button class="btn primary" id="qNext">${last?'Ver resultado':'Próxima questão'}</button>`;
  fb.hidden=false;
  document.getElementById('qNext').addEventListener('click',()=>{ if(last) renderResult(); else {Q.i++; renderQuestion();} });
  try{fb.scrollIntoView({behavior:'smooth',block:'nearest'})}catch(e){fb.scrollIntoView()}
}
function renderResult(){
  stopTimer();
  const n=Q.res.filter(r=>r.ok).length, tot=Q.res.length;
  const ms=Date.now()-Q.t0;
  if(Q.kind==='dia'&&Q.tid.modo==='hoje'){
    S.daily[`${hojeStr()}-${Q.tid.dia}-${Q.tid.n}`]={ok:n,tot};
    const ks=Object.keys(S.daily).sort(); if(ks.length>60) ks.slice(0,ks.length-60).forEach(k=>delete S.daily[k]);
    save();
  }
  const tempo=Q.timed?`<p class="rcount">Tempo total: ${fmtTime(ms)} · média de ${fmtTime(ms/Math.max(1,tot))} por questão. No ENEM, o ritmo médio é de cerca de 3 minutos por questão.</p>`:'';
  const msg=n===tot?'Gabaritou! Você domina este conteúdo.':n/tot>=0.6?'Mandou bem. Veja abaixo o que errou.':'Vale rever a aula e tentar de novo.';
  const wrong=Q.res.filter(r=>!r.ok);
  app.innerHTML=`
  <a class="back" href="${Q.back.href}">← ${Q.back.label}</a>
  <section class="score"><p class="eyebrow">${Q.title}</p><div class="big">${n}<small> de ${tot}</small></div><p>${msg}</p>${tempo}</section>
  <div class="sheet" aria-label="Seu cartão-resposta">${Q.res.map((r,k)=>`<span class="${r.ok?'r':'w'}"><b>${L[r.j]}</b>${k+1}</span>`).join('')}</div>
  ${wrong.length?`<h2>Para revisar</h2><ul class="review">${wrong.map(r=>{const q=getQ(r.id);const s=strip(q.q);return `<li><span class="meta">${AMAP[q.topic.area].sigla} · ${q.topic.nome}</span><span>${s.length>150?s.slice(0,150)+'…':s}</span><span class="meta">Você marcou ${L[r.j]}. A certa era ${L[r.c]}: ${q.o[q.a]}.</span></li>`}).join('')}</ul>`:''}
  <div class="actions">
    <button class="btn primary" id="again">${Q.kind==='dia'?(Q.tid.modo==='hoje'?'Refazer as questões de hoje':'Sortear outras questões'):Q.kind==='sim'||Q.kind==='enem'||Q.kind==='enemdia'?'Fazer outro simulado':Q.kind==='err'?'Revisar de novo':'Refazer as questões'}</button>
    ${Q.kind==='t'?`<a class="btn" href="#aula-${Q.tid}">Rever a aula</a>`:''}
    <a class="btn ghost" href="#">Voltar ao início</a>
  </div>`;
  document.getElementById('again').addEventListener('click',()=>{startQuiz(Q.kind,Q.tid); window.scrollTo(0,0)});
  window.scrollTo(0,0);
}

/* ---------- Cronômetro do simulado ---------- */
let TIMER=null;
function fmtTime(ms){const s=Math.floor(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function stopTimer(){if(TIMER){clearInterval(TIMER);TIMER=null}}
function startTimer(){stopTimer(); const tick=()=>{const el=document.getElementById('timer'); if(el&&Q) el.textContent=fmtTime(Date.now()-Q.t0)}; tick(); TIMER=setInterval(tick,1000)}

/* ---------- Repertório curinga ---------- */
let REP_FILTRO='Todos';
function repCard(){return `<a class="continue" href="#repertorio"><span class="chip" data-a="red">RED</span><span><small>Para usar em vários temas de redação</small><strong>Repertório curinga · ${REPERTORIOS.length} referências</strong></span><span class="arrow" aria-hidden="true">→</span></a>`}
function viewRepertorio(){

  app.innerHTML=`
  <a class="back" href="#area-red">← Redação</a>
  <header class="ahead"><span class="chip big" data-a="red">RED</span><h1>Repertório curinga</h1><p class="exam">Referências que servem para muitos temas de redação. Na correção do ENEM, o repertório precisa ser legitimado (vir de uma fonte confiável), pertinente ao tema e produtivo, ou seja, ajudar de verdade o seu argumento.</p></header>
  <div class="filters" role="group" aria-label="Filtrar por tema">${temas.map(t=>`<button class="fchip" type="button" data-t="${t}" aria-pressed="${t===REP_FILTRO}">${t}</button>`).join('')}</div>

}
function renderReps(){
  const list=REPERTORIOS.filter(r=>REP_FILTRO==='Todos'||r.t.includes(REP_FILTRO));
  document.getElementById('rcount').textContent=REP_FILTRO==='Todos'?`${list.length} repertórios`:`${list.length} repertórios para temas de ${REP_FILTRO.toLowerCase()}`;
  document.getElementById('replist').innerHTML=list.map(r=>`<li class="rcard"><h3>${r.n}</h3><span class="rsrc">${r.s}</span><p>${r.i}</p><p class="ruse"><b>Como usar:</b> ${r.u}</p><div class="rtags">${r.t.map(x=>`<span>${x}</span>`).join('')}</div></li>`).join('');
}

/* ---------- Modo escuro ---------- */
function themeIsDark(){const a=document.documentElement.getAttribute('data-theme'); if(a==='dark') return true; if(a==='light') return false; try{return matchMedia('(prefers-color-scheme: dark)').matches}catch(e){return false}}
function paintThemeBtn(){const b=document.getElementById('themeBtn'); if(!b) return; const d=themeIsDark();
  b.innerHTML=d?`${IC_SUN}<span>Modo claro</span>`:`${IC_MOON}<span>Modo escuro</span>`;
  b.setAttribute('aria-label',d?'Mudar para o modo claro':'Mudar para o modo escuro');}
function initTheme(){
  if(S.theme==='dark'||S.theme==='light') document.documentElement.setAttribute('data-theme',S.theme);
  paintThemeBtn();
  const b=document.getElementById('themeBtn');
  if(b) b.addEventListener('click',()=>{const t=themeIsDark()?'light':'dark'; document.documentElement.setAttribute('data-theme',t); S.theme=t; save(); paintThemeBtn();});
  try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',paintThemeBtn)}catch(e){}
  try{new MutationObserver(paintThemeBtn).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']})}catch(e){}
}

/* ---------- Navegação ---------- */
function route(){
  stopPlayer(); stopTimer();
  const h=decodeURIComponent((location.hash||'').slice(1));
  if(h.startsWith('area-')) viewArea(h.slice(5));
  else if(h.startsWith('aula-')) viewTopic(h.slice(5));
  else if(h.startsWith('questoes-')) startQuiz('t',h.slice(9));
  else if(/^dia[12]-\d+-(hoje|livre)$/.test(h)){ const mm=/^dia([12])-(\d+)-(hoje|livre)$/.exec(h); startQuiz('dia',{dia:+mm[1],n:Math.max(1,Math.min(45,+mm[2])),modo:mm[3]}); }
  else if(/^enem[12]$/.test(h)) startQuiz('enemdia',+h.slice(4));
  else if(h==='simulado') startQuiz('sim');
  else if(h==='simulado-enem') startQuiz('enem');
  else if(h==='repertorio') viewRepertorio();
  else if(h==='erros') startQuiz('err');
  else if(h==='smarttube') viewSetup();
  else viewHome();
  window.scrollTo(0,0);
}
initTheme();
window.addEventListener('hashchange',route);
route();
initNet();
</script>
