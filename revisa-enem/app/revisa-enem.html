const TOPICS=[
/* ===== MATEMÁTICA ===== */
{id:'mt-porcentagem',area:'mt',nome:'Porcentagem e juros',porque:`Aparece em quase toda prova: descontos, aumentos, juros e leitura de gráficos.`,
aula:[
 {h:`Porcentagem é uma fração de 100`,p:`<mark>25%</mark> quer dizer 25 em cada 100.<div class="f">25% = 25/100 = 0,25</div>Para calcular, troque a porcentagem pelo número decimal.`},
 {h:`Quanto é x% de um valor?`,p:`Multiplique o valor pelo decimal.<div class="f">30% de 250 = 0,30 × 250 = 75</div>`},
 {h:`Aumento e desconto: use o fator`,p:`Aumento de 20%: multiplique por <mark>1,20</mark>.<br>Desconto de 15%: multiplique por <mark>0,85</mark>.<div class="f">R$ 80 com 15% de desconto = 80 × 0,85 = R$ 68</div>`},
 {h:`Variações seguidas: multiplique`,p:`Subir 10% e depois cair 10% <mark>não</mark> volta ao preço inicial.<div class="f">1,10 × 0,90 = 0,99 → 1% a menos</div>Nunca some as porcentagens. Multiplique os fatores.`},
 {h:`Juros simples e compostos`,p:`<b>Simples:</b> juros sempre sobre o valor inicial. J = C × i × t<br><b>Compostos:</b> juros sobre juros. M = C × (1 + i)ᵗ<div class="f">R$ 1.000 a 10% ao mês, por 2 meses<br>Simples: R$ 1.200 · Compostos: R$ 1.210</div>`,
  n:`Nos juros simples, os juros são calculados sempre sobre o valor inicial: juros igual a capital vezes taxa vezes tempo. Nos juros compostos, há juros sobre juros: o montante é o capital vezes um mais a taxa, elevado ao tempo. Exemplo: mil reais a dez por cento ao mês, por dois meses. Nos juros simples, viram mil e duzentos reais. Nos compostos, mil duzentos e dez reais.`},
 {h:`Na hora da prova`,p:`Transforme tudo em fator multiplicativo.<br>Confira se a taxa é <mark>ao mês</mark> ou <mark>ao ano</mark>.<br>Desconfie de alternativas que somam porcentagens.`}
],
qs:[
 {q:`Uma loja anuncia um tênis de R$ 240,00 com 25% de desconto para pagamento à vista. Quanto paga um cliente que compra à vista?`,o:["R$ 60,00","R$ 180,00","R$ 195,00","R$ 215,00","R$ 220,00"],a:1,e:`Desconto de 25% significa pagar 75% do preço: 240 × 0,75 = R$ 180,00. R$ 60,00 é só o valor do desconto.`},
 {q:`O preço de um produto subiu 20% em janeiro e caiu 20% em fevereiro. Em relação ao preço do início de janeiro, o preço no fim de fevereiro está:`,o:["igual ao inicial","4% menor","4% maior","2% menor","40% menor"],a:1,e:`Multiplique os fatores: 1,20 × 0,80 = 0,96. O preço final é 96% do inicial, ou seja, 4% menor. Achar que +20% e −20% se anulam é a pegadinha.`},
 {q:`Uma pessoa aplicou R$ 2.000,00 a juros compostos de 5% ao mês. Sem novos depósitos ou saques, qual será o montante após 2 meses?`,o:["R$ 2.100,00","R$ 2.200,00","R$ 2.205,00","R$ 2.210,00","R$ 2.250,00"],a:2,e:`M = 2.000 × 1,05² = 2.000 × 1,1025 = R$ 2.205,00. Com juros simples seriam R$ 2.200,00, que é a alternativa-pegadinha.`}
]},
{id:'mt-proporcao',area:'mt',nome:'Razão, proporção e escala',porque:`Receitas, mapas, plantas de casa e consumo: proporção aparece em muitos contextos.`,
aula:[
 {h:`Razão: comparar por divisão`,p:`Uma turma tem 12 meninas e 8 meninos.<div class="f">meninas ÷ meninos = 12/8 = 3/2</div>Para cada 3 meninas, há 2 meninos.`},
 {h:`Proporção e produto cruzado`,p:`Proporção é uma igualdade entre duas razões.<div class="f">a/b = c/d  →  a × d = b × c</div>É a base da regra de três.`,
  n:`Proporção é uma igualdade entre duas razões. Se a sobre b é igual a c sobre d, então a vezes d é igual a b vezes c. É a base da regra de três.`},
 {h:`Direta ou inversa?`,p:`<b>Diretamente proporcionais:</b> se uma dobra, a outra dobra. Ex.: quantidade comprada e preço.<br><b>Inversamente proporcionais:</b> se uma dobra, a outra cai pela metade. Ex.: velocidade e tempo de viagem.`},
 {h:`Regra de três inversa`,p:`3 torneiras enchem um tanque em 12 horas. E 6 torneiras?<div class="f">Mais torneiras → menos tempo<br>3 × 12 = 6 × t  →  t = 6 horas</div>`},
 {h:`Escala`,p:`Escala = medida no desenho ÷ medida real, na mesma unidade.<div class="f">1 : 50.000 → 1 cm no mapa = 50.000 cm = 500 m</div>Lembre: 1 km = 100.000 cm.`,
  n:`Escala é a medida no desenho dividida pela medida real, na mesma unidade. Numa escala de um para cinquenta mil, um centímetro no mapa corresponde a cinquenta mil centímetros, ou seja, quinhentos metros na realidade. Lembre: um quilômetro tem cem mil centímetros.`},
 {h:`Na hora da prova`,p:`Antes de montar a regra de três, pergunte: <mark>se uma aumenta, a outra aumenta ou diminui?</mark><br>Em escala, converta as unidades no final.`}
],
qs:[
 {q:`Em um mapa na escala 1 : 200.000, a distância entre duas cidades é de 7 cm. Qual é a distância real entre elas?`,o:["1,4 km","2,8 km","14 km","28 km","140 km"],a:2,e:`7 × 200.000 = 1.400.000 cm. Como 1 km = 100.000 cm, a distância real é 1.400.000 ÷ 100.000 = 14 km.`},
 {q:`Uma receita de bolo usa 3 xícaras de farinha e serve 8 pessoas. Mantendo a proporção, quantas xícaras são necessárias para servir 20 pessoas?`,o:["6","6,5","7","7,5","8"],a:3,e:`Grandezas diretamente proporcionais: 3/8 = x/20 → 8x = 60 → x = 7,5 xícaras.`},
 {q:`Seis pedreiros constroem um muro em 10 dias. Trabalhando no mesmo ritmo, em quantos dias 15 pedreiros construiriam o mesmo muro?`,o:["2,5","4","5","6","25"],a:1,e:`Mais pedreiros, menos dias: proporção inversa. 6 × 10 = 15 × d → d = 60 ÷ 15 = 4 dias. O 25 aparece quando se monta a regra de três como se fosse direta.`}
]},
{id:'mt-estatistica',area:'mt',nome:'Média, moda e mediana',porque:`Tabelas e gráficos estão em toda a prova, e quase sempre pedem uma dessas medidas.`,
aula:[
 {h:`Média aritmética`,p:`Some os valores e divida pela quantidade.<div class="f">Notas 6, 7, 8 e 9 → (6 + 7 + 8 + 9) ÷ 4 = 7,5</div>`},
 {h:`Média ponderada`,p:`Cada valor tem um peso. Multiplique cada valor pelo seu peso, some e divida pela soma dos pesos.<div class="f">Prova (peso 2): nota 8 · Trabalho (peso 1): nota 5<br>(8 × 2 + 5 × 1) ÷ 3 = 21 ÷ 3 = 7</div>`},
 {h:`Moda`,p:`É o valor que <mark>mais se repete</mark>.<div class="f">2, 3, 3, 5, 3, 7 → moda = 3</div>Pode haver mais de uma moda, ou nenhuma.`},
 {h:`Mediana`,p:`É o valor do meio, com os dados <mark>em ordem</mark>.<div class="f">3, 5, 8, 10 → (5 + 8) ÷ 2 = 6,5</div>Com quantidade par, faça a média dos dois do meio.`},
 {h:`Média ou mediana?`,p:`Um valor muito alto ou muito baixo puxa a média, mas quase não mexe na mediana.<br>Por isso a mediana representa melhor salários e preços de imóveis.`},
 {h:`Na hora da prova`,p:`Ordene os dados antes de achar a mediana.<br>Em tabelas de frequência, cada valor conta tantas vezes quanto a sua frequência.`}
],
qs:[
 {q:`Um time marcou, em sete jogos, os seguintes números de gols: 2, 0, 3, 1, 2, 4, 2. A mediana e a moda desses valores são, respectivamente:`,o:["2 e 2","2 e 3","1 e 2","3 e 2","2,5 e 2"],a:0,e:`Em ordem: 0, 1, 2, 2, 2, 3, 4. O valor do meio (o 4º) é 2, então a mediana é 2. O valor que mais se repete também é 2.`},
 {q:`Num processo seletivo, a nota final é uma média ponderada: Matemática tem peso 2, Português tem peso 2 e Redação tem peso 1. Um candidato tirou 6 em Matemática, 8 em Português e 10 na Redação. Qual é a nota final?`,o:["7,0","7,2","7,6","8,0","8,4"],a:2,e:`(6 × 2 + 8 × 2 + 10 × 1) ÷ (2 + 2 + 1) = (12 + 16 + 10) ÷ 5 = 38 ÷ 5 = 7,6. O 8,0 é a média simples, sem os pesos.`},
 {q:`Os salários mensais dos cinco funcionários de uma pequena empresa são: R$ 1.500, R$ 1.500, R$ 1.800, R$ 2.000 e R$ 13.200 (o do dono). A média e a mediana desses salários são, respectivamente:`,o:["R$ 4.000 e R$ 1.800","R$ 1.800 e R$ 4.000","R$ 4.000 e R$ 1.500","R$ 1.500 e R$ 1.800","R$ 4.000 e R$ 2.000"],a:0,e:`A soma é R$ 20.000; dividida por 5, dá R$ 4.000 de média. Em ordem, o valor do meio é R$ 1.800. O salário alto do dono puxa a média para cima, por isso a mediana representa melhor o salário típico.`}
]},
{id:'mt-volumes',area:'mt',nome:'Volumes de sólidos',porque:`Caixas-d'água, latas, piscinas e embalagens: geometria espacial aparece com contas de volume e capacidade.`,
aula:[
 {h:`Volume e capacidade`,p:`Volume é o espaço que um objeto ocupa.<div class="f">1 m³ = 1.000 litros<br>1 dm³ = 1 litro · 1 cm³ = 1 mL</div>`,
  n:`Volume é o espaço que um objeto ocupa. Guarde: um metro cúbico tem mil litros. Um decímetro cúbico é um litro, e um centímetro cúbico é um mililitro.`},
 {h:`Prismas e paralelepípedos`,p:`Volume = área da base × altura.<div class="f">Paralelepípedo: V = comprimento × largura × altura</div>Vale para caixas, piscinas e salas.`},
 {h:`Cilindro`,p:`A base é um círculo, de área π × r².<div class="f">V = π × r² × h</div>No ENEM, o enunciado costuma mandar usar π = 3.`,
  n:`No cilindro, a base é um círculo, com área pi vezes o raio ao quadrado. O volume é pi vezes o raio ao quadrado vezes a altura. No ENEM, o enunciado costuma mandar usar pi igual a três.`},
 {h:`Cone e pirâmide`,p:`Têm <mark>um terço</mark> do volume do cilindro ou do prisma de mesma base e mesma altura.<div class="f">V = (área da base × altura) ÷ 3</div>`},
 {h:`Esfera`,p:`<div class="f">V = (4/3) × π × r³</div>Aparece em bolas, reservatórios esféricos e gotas.`,
  n:`O volume da esfera é quatro terços vezes pi vezes o raio ao cubo. Aparece em bolas, reservatórios esféricos e gotas.`},
 {h:`Na hora da prova`,p:`Deixe todas as medidas na mesma unidade antes de multiplicar.<br>Se todas as medidas dobram, o volume fica <mark>8 vezes</mark> maior (2 × 2 × 2).`}
],
qs:[
 {q:`Uma caixa-d'água tem forma de paralelepípedo, com medidas internas de 2 m de comprimento, 1,5 m de largura e 1 m de altura. Qual é a sua capacidade, em litros?`,o:["300","450","3.000","4.500","30.000"],a:2,e:`V = 2 × 1,5 × 1 = 3 m³. Como 1 m³ = 1.000 L, a capacidade é de 3.000 litros.`},
 {q:`Uma lata cilíndrica tem raio da base de 4 cm e altura de 10 cm. Usando π = 3, qual é o volume da lata?`,o:["120 mL","240 mL","480 mL","960 mL","1.200 mL"],a:2,e:`V = π × r² × h = 3 × 4² × 10 = 3 × 16 × 10 = 480 cm³. Como 1 cm³ = 1 mL, são 480 mL.`},
 {q:`Um copo em forma de cone e um copo em forma de cilindro têm bases iguais e a mesma altura. Quantos copos cônicos cheios são necessários para encher completamente o copo cilíndrico?`,o:["2","3","4","6","9"],a:1,e:`O volume do cone é um terço do volume do cilindro de mesma base e mesma altura. Então são necessários 3 copos cônicos.`}
]},
/* ===== NATUREZA ===== */
{id:'cn-ecologia',area:'cn',nome:'Ecologia e impactos ambientais',porque:`É o assunto mais cobrado de Biologia e costuma vir junto com problemas ambientais reais.`,
aula:[
 {h:`Cadeia alimentar`,p:`<b>Produtores</b> (plantas e algas) fazem fotossíntese.<br><b>Consumidores</b> se alimentam de outros seres: herbívoros, depois carnívoros.<br><b>Decompositores</b> (fungos e bactérias) devolvem a matéria ao ambiente.`},
 {h:`Energia flui, matéria circula`,p:`A energia segue <mark>um só sentido</mark> e diminui a cada nível: grande parte vira calor.<br>A matéria é reciclada pelos decompositores.<br>Por isso as cadeias raramente passam de 4 ou 5 níveis.`},
 {h:`Bioacumulação`,p:`Substâncias que o corpo não elimina, como o <mark>mercúrio</mark> e o inseticida DDT, se acumulam.<br>Quanto mais alto o nível na cadeia, maior a concentração: o predador do topo é o mais contaminado.`},
 {h:`Eutrofização`,p:`<div class="f">Esgoto ou fertilizante → excesso de nutrientes → explosão de algas → as algas morrem → bactérias decompõem e gastam o oxigênio → peixes morrem</div>`,
  n:`Eutrofização: o esgoto ou o fertilizante leva excesso de nutrientes para a água. As algas se multiplicam muito e depois morrem. As bactérias que fazem a decomposição consomem o oxigênio da água, e os peixes morrem por falta de oxigênio.`},
 {h:`Efeito estufa e camada de ozônio`,p:`O <b>efeito estufa</b> é natural e mantém a Terra aquecida. O problema é a intensificação por CO₂ e metano: queima de combustíveis fósseis, desmatamento e pecuária.<br>A <b>camada de ozônio</b> filtra a radiação ultravioleta e é destruída por gases CFC. São problemas diferentes.`,
  n:`O efeito estufa é natural e mantém a Terra aquecida. O problema é a intensificação por gás carbônico e metano, vindos da queima de combustíveis fósseis, do desmatamento e da pecuária. A camada de ozônio filtra a radiação ultravioleta e é destruída por gases CFC. São problemas diferentes.`},
 {h:`Na hora da prova`,p:`Leia o texto buscando <mark>causa → consequência</mark>.<br>Não confunda aquecimento global com o buraco na camada de ozônio.`}
],
qs:[
 {q:`Um rio foi contaminado por mercúrio vindo de um garimpo. Nele existe a cadeia alimentar: fitoplâncton → zooplâncton → peixe pequeno → peixe grande → garça. Em qual organismo se espera encontrar a maior concentração de mercúrio?`,o:["Fitoplâncton","Zooplâncton","Peixe pequeno","Peixe grande","Garça"],a:4,e:`O mercúrio não é eliminado pelo organismo e se acumula ao longo da cadeia (bioacumulação). O último nível, a garça, tem a maior concentração.`},
 {q:`Uma lagoa passou a receber esgoto doméstico sem tratamento. Meses depois, houve grande mortandade de peixes. A causa direta mais provável da morte dos peixes é:`,o:["o aumento do oxigênio produzido pelas algas","a redução do oxigênio dissolvido, consumido na decomposição da matéria orgânica","o aumento da temperatura causado pela luz solar","a falta de nutrientes na água","o excesso de predadores na lagoa"],a:1,e:`É a eutrofização: os nutrientes do esgoto causam explosão de algas. Quando elas morrem, as bactérias aeróbias as decompõem e consomem o oxigênio da água, e os peixes morrem asfixiados.`},
 {q:`As cadeias alimentares raramente têm mais de quatro ou cinco níveis. Isso acontece porque:`,o:["a matéria se perde completamente a cada nível","a energia diminui a cada nível, pois grande parte é gasta nas atividades dos seres vivos e perdida como calor","os decompositores consomem toda a energia dos produtores","os produtores param de fazer fotossíntese","os consumidores do topo não conseguem se reproduzir"],a:1,e:`A energia flui em um só sentido e só uma pequena parte passa para o nível seguinte. Depois de poucos níveis, não sobra energia suficiente para sustentar mais um.`}
]},
{id:'cn-genetica',area:'cn',nome:'Genética: 1ª Lei de Mendel',porque:`Cruzamentos e probabilidade em heranças como o albinismo são clássicos da prova.`,
aula:[
 {h:`Genes vêm em pares`,p:`Cada característica é definida por um par de <b>alelos</b>: um vem da mãe e o outro, do pai.`},
 {h:`Dominante e recessivo`,p:`O alelo <b>dominante</b> (A) se manifesta mesmo sozinho.<br>O <b>recessivo</b> (a) só aparece em dose dupla: <mark>aa</mark>.<br>Genótipo são os alelos. Fenótipo é a característica que aparece.`,
  n:`O alelo dominante, representado por A maiúsculo, se manifesta mesmo sozinho. O recessivo, a minúsculo, só aparece em dose dupla. Genótipo são os alelos. Fenótipo é a característica que aparece.`},
 {h:`Homozigoto e heterozigoto`,p:`<div class="f">AA ou aa → homozigoto<br>Aa → heterozigoto</div>`,
  n:`Quem tem dois alelos iguais, os dois maiúsculos ou os dois minúsculos, é homozigoto. Quem tem um de cada é heterozigoto.`},
 {h:`O cruzamento Aa × Aa`,p:`<div class="f">Aa × Aa → AA, Aa, Aa, aa</div>Resultado: <mark>3/4</mark> com a característica dominante e <mark>1/4</mark> com a recessiva.`,
  n:`Cruzando dois heterozigotos, os filhos podem ser: dois dominantes, duas vezes um de cada, ou dois recessivos. Resultado: três quartos com a característica dominante e um quarto com a recessiva.`},
 {h:`Exemplo: albinismo`,p:`O albinismo é recessivo. Um casal com pigmentação normal, mas heterozigoto (Aa × Aa), tem <mark>1/4 = 25%</mark> de chance de ter um filho albino.`,
  n:`O albinismo é recessivo. Um casal com pigmentação normal, mas heterozigoto, tem um quarto, ou vinte e cinco por cento, de chance de ter um filho albino.`},
 {h:`Na hora da prova`,p:`"E" multiplica probabilidades: menina <b>e</b> albina = 1/2 × 1/4 = 1/8.<br>"Ou" soma probabilidades de casos que não acontecem juntos.`,
  n:`Na hora da prova: a palavra e multiplica probabilidades. Ser menina e albina é um meio vezes um quarto, que dá um oitavo. A palavra ou soma as probabilidades de casos que não acontecem juntos.`}
],
qs:[
 {q:`O albinismo é uma condição recessiva. Um casal com pigmentação normal, em que os dois são heterozigotos (Aa), planeja ter um filho. Qual é a probabilidade de a criança ser albina?`,o:["0","1/4","1/2","3/4","1"],a:1,e:`Aa × Aa gera AA, Aa, Aa e aa. Só aa é albino: 1 em 4, ou seja, 1/4 (25%).`},
 {q:`Para o mesmo casal heterozigoto (Aa × Aa), qual é a probabilidade de nascer uma menina albina?`,o:["1/2","1/4","1/8","1/16","3/8"],a:2,e:`Ser menina (1/2) e ser albina (1/4) são eventos independentes: multiplique. 1/2 × 1/4 = 1/8.`},
 {q:`Em ervilhas, a cor amarela (V) é dominante sobre a verde (v). Cruzando uma planta heterozigota (Vv) com uma planta verde (vv), espera-se obter:`,o:["100% de ervilhas amarelas","75% amarelas e 25% verdes","50% amarelas e 50% verdes","25% amarelas e 75% verdes","100% de ervilhas verdes"],a:2,e:`Vv × vv gera Vv, Vv, vv e vv. Metade tem o alelo V (amarelas) e metade é vv (verdes): 50% e 50%.`}
]},
{id:'cn-eletricidade',area:'cn',nome:'Eletricidade no dia a dia',porque:`Conta de luz, chuveiro e lâmpadas: a Física do ENEM é muito ligada ao cotidiano.`,
aula:[
 {h:`Potência elétrica`,p:`A potência, em watts (W), indica quanta energia o aparelho usa por segundo.<div class="f">P = U × i</div>U é a tensão (volts) e i é a corrente (ampères).`,
  n:`A potência, medida em watts, indica quanta energia o aparelho usa por segundo. Potência é igual à tensão vezes a corrente. A tensão é medida em volts, e a corrente, em ampères.`},
 {h:`Energia consumida`,p:`<div class="f">E = P × t</div>Na conta de luz, a unidade é o <mark>kWh</mark>: potência em quilowatts × tempo em horas.`,
  n:`A energia consumida é a potência vezes o tempo. Na conta de luz, a unidade é o quilowatt-hora: potência em quilowatts vezes o tempo em horas.`},
 {h:`Exemplo: o chuveiro`,p:`Chuveiro de 5.000 W = 5 kW, ligado meia hora por dia:<div class="f">5 kW × 0,5 h = 2,5 kWh por dia<br>2,5 × 30 dias = 75 kWh no mês</div>`,
  n:`Exemplo: um chuveiro de cinco mil watts, ou cinco quilowatts, ligado meia hora por dia. São dois vírgula cinco quilowatts-hora por dia. Em trinta dias, setenta e cinco quilowatts-hora.`},
 {h:`Quanto custa`,p:`<div class="f">Custo = energia (kWh) × tarifa (R$ por kWh)<br>75 kWh × R$ 0,80 = R$ 60,00</div>`,
  n:`O custo é a energia em quilowatts-hora vezes a tarifa. Setenta e cinco quilowatts-hora vezes oitenta centavos dá sessenta reais.`},
 {h:`A chave do chuveiro`,p:`Lei de Ohm: U = R × i. Com a tensão fixa, <mark>P = U² ÷ R</mark>.<br>Na posição "inverno", a resistência é <b>menor</b>: a corrente e a potência aumentam, e a água sai mais quente.`,
  n:`Pela lei de Ohm, a tensão é a resistência vezes a corrente. Com a tensão fixa, a potência é a tensão ao quadrado dividida pela resistência. Na posição inverno, a resistência é menor: a corrente e a potência aumentam, e a água sai mais quente.`},
 {h:`Na hora da prova`,p:`Converta watts em quilowatts (÷ 1.000) e minutos em horas (÷ 60) antes de calcular.`,
  n:`Na hora da prova, converta watts em quilowatts, dividindo por mil, e minutos em horas, dividindo por sessenta, antes de calcular.`}
],
qs:[
 {q:`Um chuveiro de 4.400 W fica ligado 20 minutos por dia. Qual é o consumo de energia desse chuveiro em 30 dias?`,o:["4,4 kWh","13,2 kWh","44 kWh","88 kWh","132 kWh"],a:2,e:`4.400 W = 4,4 kW e 20 min = 1/3 h. Em 30 dias: 4,4 × (1/3) × 30 = 4,4 × 10 = 44 kWh.`},
 {q:`Uma TV de 100 W fica ligada 5 horas por dia, durante 30 dias. Se a tarifa é de R$ 0,80 por kWh, quanto a TV acrescenta à conta de luz?`,o:["R$ 1,20","R$ 4,00","R$ 12,00","R$ 15,00","R$ 120,00"],a:2,e:`E = 0,1 kW × 5 h × 30 = 15 kWh. Custo: 15 × 0,80 = R$ 12,00.`},
 {q:`Ao mudar a chave de um chuveiro elétrico da posição "verão" para a posição "inverno", com a mesma tensão da rede:`,o:["a resistência aumenta e a potência diminui","a resistência diminui e a potência aumenta","a tensão da rede dobra","a corrente elétrica diminui","resistência e potência não mudam; só muda a vazão de água"],a:1,e:`Com a tensão fixa, P = U² ÷ R. Para esquentar mais, a potência precisa aumentar, então a resistência diminui. A corrente (i = U ÷ R) também aumenta.`}
]},
{id:'cn-quimica',area:'cn',nome:'Concentração e estequiometria',porque:`A Química do ENEM cobra muita conta de proporção: soluções, diluições e reações.`,
aula:[
 {h:`Concentração comum`,p:`<div class="f">C = massa do soluto (g) ÷ volume da solução (L)</div>20 g de sal em 2 L de solução → <mark>10 g/L</mark>.`,
  n:`A concentração comum é a massa do soluto, em gramas, dividida pelo volume da solução, em litros. Vinte gramas de sal em dois litros de solução dão dez gramas por litro.`},
 {h:`Diluição`,p:`Ao adicionar água, a massa do soluto não muda.<div class="f">C₁ × V₁ = C₂ × V₂</div>1 L a 10 g/L, completado com água até 5 L → 2 g/L.`,
  n:`Na diluição, ao adicionar água, a massa do soluto não muda. A concentração inicial vezes o volume inicial é igual à concentração final vezes o volume final. Um litro a dez gramas por litro, completado com água até cinco litros, fica com dois gramas por litro.`},
 {h:`Mol e massa molar`,p:`1 mol = 6 × 10²³ partículas.<br>Massa molar: some as massas dos átomos.<div class="f">H₂O = 2 × 1 + 16 = 18 g/mol</div>`,
  n:`Um mol corresponde a seis vezes dez elevado a vinte e três partículas. A massa molar é a soma das massas dos átomos. A água tem dois hidrogênios de massa um e um oxigênio de massa dezesseis: dezoito gramas por mol.`},
 {h:`Estequiometria`,p:`A equação balanceada dá a proporção em mols.<div class="f">2 H₂ + O₂ → 2 H₂O</div>2 mol de hidrogênio reagem com 1 mol de oxigênio e formam 2 mol de água.`,
  n:`Na estequiometria, a equação balanceada dá a proporção em mols. Dois mols de hidrogênio reagem com um mol de oxigênio e formam dois mols de água.`},
 {h:`Passo a passo`,p:`1. Balanceie a equação.<br>2. Veja a proporção em mols.<br>3. Converta para massa com a massa molar.<br>4. Monte a regra de três.`},
 {h:`Na hora da prova`,p:`Confira as unidades: mL ou L, g ou kg.<br>As massas molares costumam vir no enunciado.`}
],
qs:[
 {q:`Uma solução foi preparada dissolvendo 30 g de açúcar em água até completar 500 mL de solução. Qual é a concentração dessa solução?`,o:["6 g/L","15 g/L","30 g/L","60 g/L","600 g/L"],a:3,e:`500 mL = 0,5 L. C = 30 ÷ 0,5 = 60 g/L.`},
 {q:`Uma pessoa tem 200 mL de suco concentrado com 80 g/L de açúcar e adiciona água até completar 1 L. Qual é a nova concentração de açúcar?`,o:["8 g/L","16 g/L","40 g/L","80 g/L","400 g/L"],a:1,e:`C₁ × V₁ = C₂ × V₂ → 80 × 0,2 = C₂ × 1 → C₂ = 16 g/L.`},
 {q:`Na combustão do metano, CH₄ + 2 O₂ → CO₂ + 2 H₂O. Dadas as massas molares CH₄ = 16 g/mol e CO₂ = 44 g/mol, qual é a massa de CO₂ produzida na queima completa de 32 g de metano?`,o:["22 g","44 g","64 g","88 g","176 g"],a:3,e:`32 g de CH₄ = 2 mol. A proporção é de 1 CH₄ para 1 CO₂, então formam-se 2 mol de CO₂: 2 × 44 = 88 g.`}
]},
/* ===== HUMANAS ===== */
{id:'ch-escravidao',area:'ch',nome:'Brasil Colônia e escravidão',porque:`Escravidão e resistência são temas frequentes, ligados a debates atuais sobre racismo e desigualdade.`,
aula:[
 {h:`A economia do açúcar`,p:`Nos séculos XVI e XVII, o Nordeste produziu açúcar para exportar.<br>Modelo <b>plantation</b>: grande propriedade, monocultura, produção para o mercado externo e trabalho escravizado.`,
  n:`Nos séculos dezesseis e dezessete, o Nordeste produziu açúcar para exportar. O modelo era o plantation: grande propriedade, monocultura, produção para o mercado externo e trabalho escravizado.`},
 {h:`O tráfico atlântico`,p:`Milhões de africanos foram trazidos à força.<br>O Brasil foi o <mark>maior destino</mark> de africanos escravizados nas Américas.`},
 {h:`Resistência`,p:`Fugas, quilombos, revoltas e preservação de religiões e culturas.<br><b>Palmares</b>, liderado por Zumbi, resistiu por quase um século. Zumbi morreu em 20 de novembro de 1695, data do Dia da Consciência Negra.<br><b>Revolta dos Malês:</b> Salvador, 1835.`},
 {h:`Abolição aos poucos`,p:`<div class="f">1850 · Lei Eusébio de Queirós: fim do tráfico<br>1871 · Lei do Ventre Livre<br>1885 · Lei dos Sexagenários<br>1888 · Lei Áurea: abolição</div>O Brasil foi o último país das Américas a abolir a escravidão.`},
 {h:`Depois de 1888`,p:`Os libertos não receberam terra, indenização nem políticas de inclusão.<br>Essa exclusão ajuda a explicar desigualdades raciais que existem até hoje. O ENEM gosta dessa ligação entre passado e presente.`},
 {h:`Na hora da prova`,p:`Valorize a <mark>resistência</mark> das pessoas escravizadas: o ENEM não as trata como passivas.<br>Relacione o tema a debates atuais, como racismo estrutural e ações afirmativas.`}
],
qs:[
 {q:`A Lei Eusébio de Queirós, aprovada em 1850, foi importante no processo de abolição porque:`,o:["aboliu a escravidão no Brasil","proibiu o tráfico de africanos escravizados para o Brasil","declarou livres os filhos de mulheres escravizadas","libertou os escravizados com mais de 60 anos","garantiu terras aos libertos"],a:1,e:`A Lei Eusébio de Queirós acabou com o tráfico atlântico de escravizados. O Ventre Livre veio em 1871, os Sexagenários em 1885 e a abolição em 1888.`},
 {q:`Quilombos como o de Palmares, na Serra da Barriga (atual Alagoas), representaram:`,o:["acordos de paz entre senhores e escravizados","uma forma de resistência, com comunidades formadas por pessoas que fugiram da escravidão","aldeias organizadas por jesuítas para catequizar indígenas","fazendas de açúcar administradas pela Coroa portuguesa","colônias de imigrantes europeus"],a:1,e:`Os quilombos eram comunidades de resistência, formadas principalmente por pessoas que fugiam da escravidão, com organização política e econômica próprias.`},
 {q:`Muitos historiadores afirmam que a abolição de 1888 foi "incompleta". Esse argumento se baseia no fato de que:`,o:["a escravidão continuou legal em algumas províncias","os libertos não tiveram acesso a terra, educação ou políticas de integração","os senhores foram indenizados com terras públicas","a Lei Áurea valia apenas para crianças","os imigrantes europeus passaram a ser escravizados"],a:1,e:`A Lei Áurea acabou com a escravidão em todo o país, mas não houve nenhuma política para integrar os libertos, que ficaram sem terra, sem trabalho digno e sem educação.`}
]},
{id:'ch-republica',area:'ch',nome:'Era Vargas e Ditadura Militar',porque:`Os dois períodos mais cobrados da História do Brasil República.`,
aula:[
 {h:`Era Vargas (1930–1945)`,p:`Getúlio Vargas chegou ao poder com a <b>Revolução de 1930</b>, que encerrou a República Velha e a política do café com leite.<br>No <b>Estado Novo</b> (1937–1945), governou como ditador, com censura e propaganda.`,
  n:`Getúlio Vargas chegou ao poder com a Revolução de 1930, que encerrou a República Velha e a política do café com leite. No Estado Novo, de 1937 a 1945, governou como ditador, com censura e propaganda.`},
 {h:`Trabalhismo e indústria`,p:`Salário mínimo (1940), <mark>CLT</mark> (1943) e Justiça do Trabalho.<br>Sindicatos ligados ao Estado.<br>Indústria de base: CSN, em Volta Redonda. No segundo governo, criação da Petrobras (1953).`},
 {h:`O golpe de 1964`,p:`Os militares derrubaram o presidente <b>João Goulart</b> e governaram por <b>Atos Institucionais</b>.<br>O <mark>AI-5</mark> (1968) foi o mais duro: permitiu fechar o Congresso, suspendeu o habeas corpus para crimes políticos e ampliou a censura.`,
  n:`Em 1964, os militares derrubaram o presidente João Goulart e governaram por Atos Institucionais. O AI 5, de 1968, foi o mais duro: permitiu fechar o Congresso, suspendeu o habeas corpus para crimes políticos e ampliou a censura.`},
 {h:`Repressão e "milagre"`,p:`Tortura, exílio e censura à imprensa e às artes.<br>O <b>milagre econômico</b> (1968–1973) trouxe crescimento alto, mas também concentração de renda e aumento da dívida externa.`,
  n:`O regime teve tortura, exílio e censura à imprensa e às artes. O milagre econômico, de 1968 a 1973, trouxe crescimento alto, mas também concentração de renda e aumento da dívida externa.`},
 {h:`Redemocratização`,p:`<div class="f">1979 · Lei da Anistia<br>1983–1984 · Diretas Já<br>1985 · fim do regime militar<br>1988 · Constituição Cidadã</div>`,
  n:`A redemocratização: em 1979, a Lei da Anistia. Em 1983 e 1984, o movimento Diretas Já. Em 1985, o fim do regime militar. E em 1988, a Constituição Cidadã.`},
 {h:`Na hora da prova`,p:`Textos, músicas e charges da época são comuns. Repare na <mark>censura</mark> e nas mensagens disfarçadas das canções de protesto.`}
],
qs:[
 {q:`O Ato Institucional nº 5, de 1968, é considerado o mais duro do regime militar porque:`,o:["convocou eleições diretas para presidente","permitiu fechar o Congresso e suspendeu o habeas corpus para crimes políticos","criou a Consolidação das Leis do Trabalho","concedeu anistia aos presos políticos","instituiu o voto feminino"],a:1,e:`O AI-5 deu poderes amplos ao presidente: fechar o Congresso, cassar mandatos, suspender o habeas corpus em crimes políticos e ampliar a censura.`},
 {q:`Uma das marcas do governo de Getúlio Vargas foi:`,o:["a criação da Consolidação das Leis do Trabalho (CLT)","a privatização das empresas estatais","o fim do voto secreto","a abolição da escravidão","o fortalecimento da política do café com leite"],a:0,e:`A CLT, de 1943, reuniu as leis trabalhistas. Vargas também criou o salário mínimo e a Justiça do Trabalho. O voto secreto foi criado no seu governo, em 1932, e não extinto.`},
 {q:`Sobre o "milagre econômico" brasileiro (1968–1973), é correto afirmar que:`,o:["reduziu a desigualdade de renda no país","teve alto crescimento econômico, acompanhado de concentração de renda e aumento da dívida externa","aconteceu durante a Era Vargas","acabou definitivamente com a inflação","foi marcado pela ampla liberdade de imprensa"],a:1,e:`O PIB cresceu muito, mas os ganhos se concentraram nas camadas mais ricas e o país se endividou. Tudo isso sob censura.`}
]},
{id:'ch-geografia',area:'ch',nome:'Cidades e meio ambiente',porque:`Urbanização e problemas ambientais aparecem com mapas, gráficos e notícias.`,
aula:[
 {h:`Urbanização brasileira`,p:`Foi rápida e se acelerou a partir de 1950, com o <b>êxodo rural</b> e a industrialização.<br>Hoje mais de 80% dos brasileiros vivem em cidades.`},
 {h:`Problemas urbanos`,p:`Favelização, segregação socioespacial, trânsito e falta de saneamento.<br>As cidades cresceram mais rápido que a infraestrutura.`},
 {h:`Enchentes`,p:`A <mark>impermeabilização do solo</mark> (asfalto e concreto) impede a água de infiltrar.<br>A ocupação das margens dos rios e o lixo nos bueiros completam o problema.`},
 {h:`Ilha de calor e inversão térmica`,p:`<b>Ilha de calor:</b> o centro da cidade fica mais quente, porque asfalto e concreto absorvem calor e há pouca vegetação.<br><b>Inversão térmica:</b> uma camada de ar frio fica presa junto ao solo e segura a poluição. É mais comum no inverno.`},
 {h:`Questões ambientais no Brasil`,p:`Desmatamento da Amazônia e do Cerrado pela expansão da agropecuária, queimadas e <b>assoreamento</b> dos rios quando a mata ciliar é retirada.`},
 {h:`Na hora da prova`,p:`Relacione <mark>ação humana → consequência ambiental</mark>.<br>Leia com atenção as legendas de mapas e gráficos.`}
],
qs:[
 {q:`Em grandes cidades brasileiras, as enchentes são agravadas principalmente por:`,o:["excesso de áreas verdes","impermeabilização do solo e ocupação das margens dos rios","baixa densidade populacional","inversão térmica","aumento da mata ciliar"],a:1,e:`Asfalto e concreto impedem a infiltração da água da chuva, que escoa toda de uma vez para rios já ocupados e canalizados.`},
 {q:`O fenômeno da ilha de calor urbana está relacionado:`,o:["à concentração de asfalto e concreto e à redução da vegetação","à formação de geadas no centro das cidades","a uma camada de ar frio presa junto ao solo","às chuvas ácidas","ao aumento da umidade causado pela arborização"],a:0,e:`Materiais como asfalto e concreto absorvem e liberam calor, e a falta de vegetação reduz o resfriamento. A camada de ar frio presa junto ao solo descreve a inversão térmica, outro fenômeno.`},
 {q:`A retirada da mata ciliar das margens de um rio tende a provocar:`,o:["aumento da profundidade do rio","assoreamento, pelo acúmulo de sedimentos no leito","redução da erosão nas margens","aumento da biodiversidade aquática","diminuição das enchentes"],a:1,e:`Sem a vegetação, a terra das margens é levada pela chuva e se acumula no fundo do rio, que fica mais raso: é o assoreamento.`}
]},
{id:'ch-filosofia',area:'ch',nome:'Filosofia e Sociologia',porque:`Trechos curtos de pensadores clássicos: saber a ideia central de cada um resolve a maioria das questões.`,
aula:[
 {h:`Como cai`,p:`Filosofia e Sociologia aparecem com trechos curtos de pensadores. Saber a <mark>ideia central</mark> de cada um resolve a maioria das questões.`},
 {h:`Contratualistas`,p:`<b>Hobbes:</b> sem governo, haveria "guerra de todos contra todos". As pessoas entregam o poder a um soberano forte, o Leviatã.<br><b>Locke:</b> direitos naturais à vida, à liberdade e à propriedade. Um governo que os viola pode ser derrubado.<br><b>Rousseau:</b> o ser humano nasce bom e a sociedade o corrompe. Defende a vontade geral e a soberania do povo.`},
 {h:`Iluminismo (século XVIII)`,p:`A razão contra o absolutismo e a intolerância.<br><b>Montesquieu:</b> divisão do poder em Executivo, Legislativo e Judiciário.<br><b>Kant:</b> esclarecimento é sair da "menoridade" e ter coragem de pensar por si mesmo.`,
  n:`O Iluminismo, no século dezoito, defendeu a razão contra o absolutismo e a intolerância. Montesquieu propôs a divisão do poder em Executivo, Legislativo e Judiciário. Kant disse que esclarecimento é sair da menoridade e ter coragem de pensar por si mesmo.`},
 {h:`Sociologia clássica`,p:`<b>Durkheim:</b> fato social, que é exterior, geral e coercitivo.<br><b>Marx:</b> luta de classes, mais-valia e alienação do trabalhador.<br><b>Weber:</b> ação social e tipos de dominação: tradicional, carismática e racional-legal.`},
 {h:`Temas atuais`,p:`<b>Indústria cultural</b> (Adorno e Horkheimer): a cultura vira mercadoria produzida em série.<br>Cidadania, trabalho e tecnologia também aparecem bastante.`},
 {h:`Na hora da prova`,p:`Ache o autor pela palavra-chave:<div class="f">Leviatã → Hobbes<br>três poderes → Montesquieu<br>fato social → Durkheim<br>mais-valia → Marx</div>`,
  n:`Na hora da prova, ache o autor pela palavra-chave. Leviatã: Hobbes. Três poderes: Montesquieu. Fato social: Durkheim. Mais-valia: Marx.`}
],
qs:[
 {q:`"Sem um poder comum capaz de manter todos em respeito, os homens vivem numa condição de guerra de todos contra todos." Essa ideia é central no pensamento de:`,o:["John Locke","Jean-Jacques Rousseau","Thomas Hobbes","Montesquieu","Karl Marx"],a:2,e:`Para Hobbes, no estado de natureza há "guerra de todos contra todos". Por isso, as pessoas aceitam entregar o poder a um soberano forte, o Leviatã.`},
 {q:`A ideia de que o poder do Estado deve ser dividido em Executivo, Legislativo e Judiciário, para evitar abusos, é associada a:`,o:["Montesquieu","Thomas Hobbes","Émile Durkheim","Nicolau Maquiavel","Platão"],a:0,e:`Montesquieu, pensador iluminista, defendeu a separação dos três poderes, que fiscalizam uns aos outros.`},
 {q:`Para Émile Durkheim, fatos sociais são maneiras de agir, pensar e sentir que:`,o:["dependem só da vontade de cada indivíduo","são exteriores ao indivíduo, gerais e exercem coerção sobre ele","existem apenas nas sociedades industriais","resultam exclusivamente da luta de classes","são sempre ações irracionais"],a:1,e:`O fato social tem três características: exterioridade (existe fora do indivíduo), generalidade (vale para o grupo) e coercitividade (pressiona a pessoa a seguir as regras).`}
]},
/* ===== LINGUAGENS ===== */
{id:'lc-funcoes',area:'lc',nome:'Funções da linguagem',porque:`Toda prova pergunta qual é a intenção principal de um texto, e as funções da linguagem respondem isso.`,
aula:[
 {h:`Toda mensagem tem uma intenção`,p:`As seis <b>funções da linguagem</b> mostram em que parte da comunicação o texto se concentra: no assunto, em quem fala, em quem ouve, no canal, no código ou na própria mensagem.`},
 {h:`Referencial e emotiva`,p:`<b>Referencial:</b> foco na informação, linguagem objetiva. Notícias e textos científicos.<br><b>Emotiva:</b> foco em quem fala, em 1ª pessoa, com sentimentos e opiniões. Diários e poemas líricos.`,
  n:`Função referencial: foco na informação, com linguagem objetiva. Aparece em notícias e textos científicos. Função emotiva: foco em quem fala, em primeira pessoa, com sentimentos e opiniões. Aparece em diários e poemas líricos.`},
 {h:`Conativa ou apelativa`,p:`Foco em quem recebe a mensagem: quer <mark>convencer</mark>.<br>Verbos no imperativo, uso de "você" e vocativos. É a função das propagandas.`},
 {h:`Fática e metalinguística`,p:`<b>Fática:</b> testa ou mantém o contato. "Alô?", "Tá me ouvindo?", "Bom dia!"<br><b>Metalinguística:</b> a linguagem falando dela mesma. Verbete de dicionário, poema sobre escrever poemas, filme sobre cinema.`},
 {h:`Poética`,p:`Foco na forma da mensagem: rimas, ritmo, sonoridade e jogos de palavras.<br>Aparece em poemas e também em slogans criativos.`},
 {h:`Na hora da prova`,p:`Um texto pode ter várias funções. O ENEM pergunta qual <mark>predomina</mark>.<br>Pergunte-se: qual é a intenção principal deste texto?`}
],
qs:[
 {q:`Leia o anúncio:<blockquote>Não perca tempo! Garanta já o seu e aproveite o desconto exclusivo para você.</blockquote>A função da linguagem que predomina nesse texto é a:`,o:["referencial","emotiva","conativa","fática","metalinguística"],a:2,e:`O texto se dirige ao leitor ("você") com verbos no imperativo ("garanta", "aproveite") para convencê-lo a comprar: função conativa, ou apelativa.`},
 {q:`Leia o poema:<blockquote>Este poema fala de si:<br>cada verso que aqui ponho<br>explica como se faz<br>um verso, enquanto o componho.</blockquote>Nesse texto, predomina a função:`,o:["fática","metalinguística","referencial","conativa","emotiva"],a:1,e:`O poema fala do próprio ato de fazer poemas: é a linguagem tratando de si mesma, marca da função metalinguística.`},
 {q:`Observe o diálogo:<blockquote>— Alô? Alô? Está me ouvindo?<br>— Oi! Estou sim, pode falar.</blockquote>Nesse trecho, predomina a função:`,o:["poética","referencial","fática","conativa","emotiva"],a:2,e:`As falas servem para testar e confirmar o contato pelo canal (o telefone), sem transmitir informação nova: função fática.`}
]},
{id:'lc-variacao',area:'lc',nome:'Variação linguística',porque:`Um dos temas mais cobrados de Linguagens, quase sempre com o tema do preconceito linguístico.`,
aula:[
 {h:`A língua muda`,p:`O português varia conforme o <b>lugar</b>, o <b>grupo social</b>, a <b>situação</b> e a <b>época</b>. Isso é natural em qualquer língua.`},
 {h:`Variação regional e social`,p:`<b>Regional:</b> sotaques e palavras de cada lugar. Mandioca, aipim e macaxeira são a mesma raiz.<br><b>Social:</b> muda com idade, profissão e grupo. Gírias e jargões são exemplos.`},
 {h:`Variação situacional e histórica`,p:`<b>Situacional:</b> falamos de um jeito com amigos e de outro numa entrevista de emprego.<br><b>Histórica:</b> a língua muda com o tempo. <mark>Vossa mercê → vosmecê → você</mark>.`,
  n:`Variação situacional: falamos de um jeito com amigos e de outro numa entrevista de emprego. Variação histórica: a língua muda com o tempo. Vossa mercê virou vosmecê, que virou você.`},
 {h:`Adequação, não "certo e errado"`,p:`A norma-padrão é uma das variedades da língua, exigida em situações formais, como a redação do ENEM.<br>Nenhuma variedade é errada: ela é <mark>adequada ou inadequada</mark> ao contexto.`},
 {h:`Preconceito linguístico`,p:`É julgar alguém como inferior pelo jeito de falar. O ENEM costuma condenar esse preconceito e valorizar a diversidade da língua.`},
 {h:`Na hora da prova`,p:`Procure a ideia de <mark>adequação</mark>. Alternativas que chamam uma fala de "errada" ou "feia" quase nunca são a resposta.`}
],
qs:[
 {q:`Em diferentes regiões do Brasil, a mesma raiz é chamada de mandioca, aipim ou macaxeira. Esse fato é um exemplo de variação:`,o:["histórica","regional","situacional","social, ligada à idade","nenhuma, pois só uma das palavras está correta"],a:1,e:`As palavras mudam conforme a região do país, e todas estão corretas: é variação regional (também chamada diatópica).`},
 {q:`A forma de tratamento "vossa mercê" se transformou em "vosmecê" e, depois, em "você". Esse processo é um exemplo de variação:`,o:["regional","social","histórica","situacional","causada por erro de português"],a:2,e:`A mudança aconteceu ao longo dos séculos: é variação histórica (diacrônica).`},
 {q:`Um morador da zona rural foi alvo de risadas ao dizer "nós vai" numa entrevista de TV. Do ponto de vista dos estudos da linguagem, é correto afirmar que:`,o:["ele falou errado, pois só a norma-padrão é português de verdade","a fala dele é uma variedade legítima, e zombar dela é preconceito linguístico, embora a norma-padrão seja esperada em situações formais","quem mora na zona rural não domina a língua portuguesa","as variedades populares devem ser proibidas nas escolas","a língua portuguesa não muda com o tempo"],a:1,e:`Toda variedade tem regras próprias e é legítima. Rir de alguém pela forma de falar é preconceito linguístico. A norma-padrão é a mais adequada em situações formais, mas isso não torna as outras variedades "erradas".`}
]},
{id:'lc-generos',area:'lc',nome:'Gêneros textuais e interpretação',porque:`A maior parte de Linguagens é interpretação, com charges, crônicas, anúncios e tirinhas.`,
aula:[
 {h:`Interpretação é a base`,p:`A maior parte das questões de Linguagens é de interpretação. Reconhecer o <b>gênero</b> do texto ajuda a entender sua intenção.`},
 {h:`Tipos e gêneros`,p:`<b>Tipos</b> são poucos: narração, descrição, dissertação, exposição e injunção.<br><b>Gêneros</b> são os textos do dia a dia: notícia, crônica, charge, anúncio, receita, artigo de opinião, tirinha, meme.`},
 {h:`Gêneros que mais aparecem`,p:`<b>Notícia:</b> informa um fato recente, de forma impessoal.<br><b>Crônica:</b> fato do cotidiano com olhar pessoal e linguagem leve.<br><b>Artigo de opinião:</b> defende um ponto de vista com argumentos.`},
 {h:`Charges e tirinhas`,p:`Junte <mark>imagem e texto</mark>. O humor costuma vir de uma crítica ou de uma quebra de expectativa.<br>Na charge, pense no fato da época que está sendo criticado.`},
 {h:`Como resolver`,p:`Leia o comando primeiro. Depois leia o texto procurando a resposta.<br>Elimine alternativas que dizem mais do que o texto diz ou que se apoiam num detalhe só.`},
 {h:`Na hora da prova`,p:`Palavras absolutas nas alternativas, como <mark>sempre, nunca, todos, apenas</mark>, costumam indicar resposta errada.`}
],
qs:[
 {q:`Texto curto que parte de um acontecimento do cotidiano, com linguagem leve e o olhar pessoal do autor, publicado em jornais ou revistas. Essa descrição corresponde ao gênero:`,o:["notícia","crônica","editorial","verbete","receita"],a:1,e:`A crônica parte do cotidiano e traz a visão pessoal do autor. A notícia é impessoal, e o editorial expressa a opinião do próprio jornal.`},
 {q:`A charge é um gênero que se caracteriza por:`,o:["narrar fatos de forma imparcial","usar humor e exagero para criticar um fato ou um personagem da atualidade","ensinar procedimentos passo a passo","apresentar dados científicos de forma objetiva","ser sempre um texto sem imagens"],a:1,e:`A charge combina desenho e, às vezes, texto para fazer uma crítica bem-humorada a algo atual. Por isso, conhecer o contexto ajuda a entendê-la.`},
 {q:`Leia o trecho:<blockquote>O celular aproximou quem estava longe. Mas, às vezes, basta olhar para uma mesa de restaurante, onde cada um encara a própria tela em silêncio, para perceber que ele também afastou quem estava perto.</blockquote>O texto sugere que:`,o:["o celular só traz prejuízos","a tecnologia tem efeitos contraditórios nas relações pessoais","as pessoas nunca conversam em restaurantes","o uso do celular deveria ser proibido","a distância física deixou de existir"],a:1,e:`O texto mostra dois lados: o celular aproxima quem está longe e afasta quem está perto. As outras alternativas exageram ("só", "nunca") ou dizem algo que o texto não diz.`}
]},
{id:'lc-figuras',area:'lc',nome:'Figuras de linguagem',porque:`Aparecem em poemas, letras de música e propagandas, sempre perguntando o efeito de sentido.`,
aula:[
 {h:`Para que servem`,p:`Figuras de linguagem dão expressividade ao texto. O ENEM pede para reconhecer o <mark>efeito de sentido</mark> que elas criam.`},
 {h:`Comparação e metáfora`,p:`<b>Comparação:</b> usa conectivo. "Ela é forte <mark>como</mark> uma rocha."<br><b>Metáfora:</b> compara sem conectivo. "A vida é uma estrada."`},
 {h:`Metonímia e personificação`,p:`<b>Metonímia:</b> troca um termo por outro próximo. "Li Machado de Assis" (o autor pela obra). "Bebi dois copos" (o copo pelo conteúdo).<br><b>Personificação:</b> dá ações humanas a seres não humanos. "O vento sussurrava."`},
 {h:`Hipérbole, eufemismo e ironia`,p:`<b>Hipérbole:</b> exagero. "Já te falei um milhão de vezes."<br><b>Eufemismo:</b> suaviza. "Ele partiu desta para melhor."<br><b>Ironia:</b> diz o contrário do que pensa. "Que belo serviço!", diante de algo malfeito.`},
 {h:`Antítese e paradoxo`,p:`<b>Antítese:</b> aproxima ideias opostas. "Entre o riso e o choro."<br><b>Paradoxo:</b> une opostos numa ideia que parece absurda. "Um silêncio ensurdecedor."`},
 {h:`Na hora da prova`,p:`Mais do que decorar nomes, entenda o efeito: <mark>exagerar, suavizar, criticar, aproximar</mark>.`}
],
qs:[
 {q:`Na frase "Já te liguei mil vezes hoje!", a figura de linguagem usada é a:`,o:["metáfora","hipérbole","eufemismo","metonímia","antítese"],a:1,e:`"Mil vezes" é um exagero intencional para enfatizar a insistência: hipérbole.`},
 {q:`Na frase "Vou ler Machado de Assis nas férias", ocorre:`,o:["metonímia","personificação","ironia","hipérbole","comparação"],a:0,e:`O nome do autor substitui a obra dele: é uma metonímia.`},
 {q:`Depois de esperar duas horas na fila, um cliente comentou: "Que atendimento rápido!". A figura de linguagem presente é a:`,o:["eufemismo","ironia","antítese","metáfora","onomatopeia"],a:1,e:`O cliente diz o contrário do que pensa para criticar a demora: ironia.`}
]},
/* ===== REDAÇÃO ===== */
{id:'red-estrutura',area:'red',nome:'Estrutura e as 5 competências',porque:`Saber como a redação é corrigida mostra onde você ganha e onde perde pontos.`,
aula:[
 {h:`Como a redação é avaliada`,p:`Texto <b>dissertativo-argumentativo</b> de até 30 linhas.<br>Nota de 0 a 1.000, dividida em <mark>5 competências</mark> que valem até 200 pontos cada.`},
 {h:`Competências 1 e 2`,p:`<b>C1:</b> domínio da escrita formal da língua portuguesa.<br><b>C2:</b> compreender o tema e usar conhecimentos de várias áreas, sem fugir do tipo dissertativo-argumentativo.`,
  n:`Competência um: domínio da escrita formal da língua portuguesa. Competência dois: compreender o tema e usar conhecimentos de várias áreas, sem fugir do tipo dissertativo-argumentativo.`},
 {h:`Competências 3, 4 e 5`,p:`<b>C3:</b> selecionar e organizar argumentos para defender um ponto de vista.<br><b>C4:</b> coesão, com bom uso de conectivos como <i>além disso</i>, <i>portanto</i> e <i>entretanto</i>.<br><b>C5:</b> proposta de intervenção para o problema, respeitando os direitos humanos.`,
  n:`Competência três: selecionar e organizar argumentos para defender um ponto de vista. Competência quatro: coesão, com bom uso de conectivos como além disso, portanto e entretanto. Competência cinco: proposta de intervenção para o problema, respeitando os direitos humanos.`},
 {h:`Estrutura em 4 parágrafos`,p:`<div class="f">Introdução: contexto e tese<br>Desenvolvimento 1: argumento e repertório<br>Desenvolvimento 2: argumento e repertório<br>Conclusão: proposta de intervenção</div>`},
 {h:`Repertório sociocultural`,p:`Dados, leis, fatos históricos, filósofos, livros e filmes.<br>Precisa ter <mark>relação com o tema</mark> e sustentar o argumento, não só aparecer citado.`},
 {h:`O que zera a redação`,p:`Fuga total ao tema, texto que não é dissertativo-argumentativo, até 7 linhas escritas, folha em branco e trechos sem relação com o tema, entre outros motivos.`}
],
qs:[
 {q:`Na correção da redação do ENEM, qual é a nota máxima de cada uma das cinco competências?`,o:["100 pontos","200 pontos","250 pontos","500 pontos","1.000 pontos"],a:1,e:`São cinco competências de até 200 pontos cada, o que dá a nota máxima de 1.000.`},
 {q:`O uso adequado de conectivos como "além disso", "portanto" e "entretanto", que ligam as partes do texto, é avaliado principalmente na:`,o:["Competência 1","Competência 2","Competência 3","Competência 4","Competência 5"],a:3,e:`A Competência 4 avalia a coesão: os mecanismos que ligam frases e parágrafos, como os conectivos.`},
 {q:`Recebe nota zero a redação que:`,o:["usa repertório de filosofia","tem quatro parágrafos","foge totalmente ao tema proposto","apresenta uma proposta de intervenção","usa conectivos variados"],a:2,e:`A fuga total ao tema é um dos motivos de nota zero. Todas as outras alternativas descrevem coisas que ajudam a nota.`}
]},
{id:'red-intervencao',area:'red',nome:'Proposta de intervenção',porque:`Vale até 200 pontos e segue um modelo que dá para treinar.`,
aula:[
 {h:`Onde e para quê`,p:`A proposta de intervenção fica na conclusão. Ela apresenta uma solução <mark>detalhada</mark> para o problema discutido no texto.`},
 {h:`Os 5 elementos`,p:`<div class="f">Agente: quem vai agir?<br>Ação: o que será feito?<br>Meio ou modo: como?<br>Finalidade: para quê?<br>Detalhamento: mais informação sobre um dos elementos</div>`},
 {h:`Exemplo completo`,p:`"Portanto, <b>o Ministério da Educação</b> <small>(agente)</small> deve <b>promover campanhas de leitura nas escolas públicas</b> <small>(ação)</small>, <b>por meio de parcerias com bibliotecas municipais</b> <small>(meio)</small>, <b>a fim de formar leitores críticos</b> <small>(finalidade)</small>. Essas campanhas devem incluir <b>rodas de conversa mensais com autores locais</b> <small>(detalhamento)</small>."`,
  n:`Exemplo completo: Portanto, o Ministério da Educação, que é o agente, deve promover campanhas de leitura nas escolas públicas, que é a ação, por meio de parcerias com bibliotecas municipais, que é o meio, a fim de formar leitores críticos, que é a finalidade. Essas campanhas devem incluir rodas de conversa mensais com autores locais: esse é o detalhamento.`},
 {h:`Erros comuns`,p:`Proposta vaga: "o governo deve fazer algo".<br>Agente genérico demais: "a sociedade".<br>Solução sem ligação com os problemas discutidos no desenvolvimento.`},
 {h:`Direitos humanos`,p:`A proposta não pode desrespeitar os direitos humanos. Pena de morte, tortura, censura ou "justiça com as próprias mãos" não podem ser soluções.`},
 {h:`Na hora da prova`,p:`Ligue a proposta aos argumentos do desenvolvimento: <mark>uma ação para cada problema</mark> apontado deixa o texto coerente.`}
],
qs:[
 {q:`Leia a proposta:<blockquote>O Governo Federal deve criar campanhas contra o desperdício de alimentos, por meio das redes sociais.</blockquote>Para ficar completa, segundo os critérios do ENEM, ela ainda precisa de:`,o:["agente e ação","finalidade e detalhamento","apenas o meio","ação e meio","nada, pois já está completa"],a:1,e:`Agente: Governo Federal. Ação: criar campanhas. Meio: redes sociais. Faltam a finalidade (para quê?) e o detalhamento de algum dos elementos.`},
 {q:`No trecho "as prefeituras devem oferecer transporte escolar gratuito, a fim de reduzir a evasão escolar", a parte "a fim de reduzir a evasão escolar" corresponde a qual elemento da proposta de intervenção?`,o:["Agente","Ação","Meio ou modo","Finalidade","Detalhamento"],a:3,e:`"A fim de" introduz o objetivo da ação, ou seja, a finalidade.`},
 {q:`Qual das propostas abaixo desrespeita os direitos humanos e, por isso, seria penalizada na redação do ENEM?`,o:["Criar campanhas educativas sobre reciclagem nas escolas","Aplicar pena de morte a quem comete crimes ambientais","Ampliar o número de vagas em creches públicas","Usar drones para fiscalizar o desmatamento","Oferecer bolsas de estudo a estudantes de baixa renda"],a:1,e:`A pena de morte viola o direito à vida e não é aceita como proposta. As outras alternativas são soluções possíveis.`}
]}
];

 {q:`A queima de combustíveis fósseis e o desmatamento contribuem principalmente para:`,o:["o buraco na camada de ozônio","a intensificação do efeito estufa, pelo aumento de CO₂ na atmosfera","o excesso de oxigênio nos oceanos","a redução da temperatura média da Terra","a formação de chuva de granizo"],a:1,e:`Os dois processos liberam gás carbônico (CO₂), que intensifica o efeito estufa e o aquecimento global. O buraco na camada de ozônio é causado por gases como os CFCs.`},

],

 {q:`A Revolta dos Malês, ocorrida em Salvador em 1835, foi organizada principalmente por:`,o:["indígenas aldeados por jesuítas","africanos escravizados e libertos, muitos deles muçulmanos","imigrantes italianos","fazendeiros de café","militares que defendiam a República"],a:1,e:`Os malês eram africanos muçulmanos, escravizados e libertos. A revolta foi duramente reprimida, mas mostra a capacidade de organização da resistência negra.`},

],

],
'ch-geografia':[
 {q:`O êxodo rural no Brasil, intenso a partir de 1950, foi causado principalmente:`,o:["pela atração das indústrias nas cidades e pela mecanização e concentração de terras no campo","pela falta de terrenos nas cidades","pelo fim da industrialização","pela proibição da agricultura familiar","pelo crescimento do turismo rural"],a:0,e:`As indústrias atraíam trabalhadores para as cidades, enquanto a mecanização e a concentração de terras expulsavam a população do campo.`},
 {q:`A inversão térmica, comum no inverno em grandes cidades, agrava problemas respiratórios porque:`,o:["aumenta a umidade do ar","uma camada de ar frio fica presa junto ao solo e retém os poluentes","provoca chuvas ácidas intensas","destrói a camada de ozônio","aumenta a vegetação urbana"],a:1,e:`Normalmente o ar quente sobe e leva os poluentes. Na inversão térmica, o ar frio, mais denso, fica preso embaixo de uma camada de ar quente e segura a poluição perto do solo.`},
 {q:`A segregação socioespacial nas cidades brasileiras se manifesta, por exemplo:`,o:["na distribuição igual de serviços públicos por todos os bairros","na concentração da população pobre em periferias e favelas, com menos infraestrutura","no fim das desigualdades urbanas","na proibição de condomínios fechados","na queda do preço dos imóveis nas áreas centrais"],a:1,e:`A população de baixa renda tende a morar em áreas mais distantes ou de risco, com menos transporte, saneamento e serviços, enquanto as áreas mais bem servidas concentram os mais ricos.`}
],
'ch-filosofia':[
 {q:`Para John Locke, o governo existe para:`,o:["impor a vontade de um soberano absoluto","proteger os direitos naturais à vida, à liberdade e à propriedade","acabar com a propriedade privada","representar a vontade divina","garantir a luta de classes"],a:1,e:`Para Locke, as pessoas criam o governo para proteger seus direitos naturais. Se o governo os viola, o povo tem o direito de resistir a ele.`},
 {q:`O conceito de mais-valia, de Karl Marx, refere-se:`,o:["ao valor dos impostos pagos ao Estado","à diferença entre o valor que o trabalhador produz e o salário que recebe, que fica com o capitalista","ao lucro obtido no comércio exterior","ao valor moral do trabalho","à poupança dos trabalhadores"],a:1,e:`Para Marx, o trabalhador produz mais valor do que recebe em salário. Essa diferença, a mais-valia, fica com o dono dos meios de produção e é a base da exploração no capitalismo.`},
 {q:`Para Max Weber, a dominação baseada em leis e regras impessoais, como na burocracia de um Estado moderno, é a dominação:`,o:["tradicional","carismática","racional-legal","religiosa","militar"],a:2,e:`Weber descreve três tipos de dominação: tradicional (baseada nos costumes), carismática (baseada nas qualidades de um líder) e racional-legal (baseada em leis e regras impessoais).`}
],
'lc-funcoes':[
 {q:`Leia o verbete:<blockquote>casa (subst. fem.): construção destinada à moradia.</blockquote>Nesse texto, predomina a função:`,o:["emotiva","poética","metalinguística","fática","conativa"],a:2,e:`O verbete de dicionário usa a linguagem para explicar a própria linguagem, isto é, o significado de uma palavra: função metalinguística.`},
 {q:`Leia o trecho de notícia:<blockquote>A Defesa Civil registrou 120 milímetros de chuva em 24 horas na capital. Três bairros tiveram alagamentos, e não houve feridos.</blockquote>Predomina a função:`,o:["referencial","emotiva","conativa","poética","fática"],a:0,e:`O texto informa fatos de forma objetiva, sem opinião nem apelo ao leitor: função referencial.`},

],
'lc-variacao':[
 {q:`Um jovem diz aos amigos: "Mano, o rolê de ontem foi muito top!". Numa entrevista de emprego, ele diz: "O evento de ontem foi muito bom". Essa mudança no jeito de falar é um exemplo de variação:`,o:["histórica","regional","situacional","social, ligada à profissão","nenhuma, pois a primeira frase está errada"],a:2,e:`A mesma pessoa adapta a fala ao contexto: mais informal com os amigos e mais formal na entrevista. É a variação situacional (diafásica).`},
 {q:`Expressões como "habeas corpus", "petição inicial" e "trânsito em julgado", usadas por advogados, são exemplos de:`,o:["variação histórica","jargão, um tipo de variação social ligada à profissão","variação regional","erro de português","gíria de adolescentes"],a:1,e:`Jargões são vocabulários próprios de uma profissão ou área. Eles fazem parte da variação social (diastrática).`},
 {q:`Na redação do ENEM, o candidato deve usar:`,o:["gírias, para se aproximar do leitor","a norma-padrão, por ser uma situação formal de comunicação","a variedade regional da sua cidade","qualquer variedade, pois todas são aceitas na correção","linguagem de internet, com abreviações"],a:1,e:`A redação do ENEM é uma situação formal, e a Competência 1 avalia o domínio da escrita formal (norma-padrão). Isso não torna as outras variedades erradas: elas só não são adequadas a esse contexto.`}
],
'lc-generos':[
 {q:`Um texto que apresenta ingredientes e modo de preparo, com verbos no imperativo como "misture" e "asse", pertence ao tipo textual:`,o:["narrativo","descritivo","injuntivo","dissertativo","expositivo"],a:2,e:`A receita orienta o leitor a realizar uma tarefa, com verbos no imperativo. Esse é o tipo injuntivo, também chamado de instrucional.`},
 {q:`O editorial de um jornal se diferencia da notícia porque:`,o:["apresenta a opinião do próprio jornal sobre um tema","é sempre escrito em versos","não trata de assuntos atuais","é escrito por um leitor","usa apenas imagens"],a:0,e:`A notícia informa o fato de forma impessoal. O editorial expressa a opinião do veículo de comunicação sobre um assunto, geralmente sem assinatura individual.`},
 {q:`Leia o trecho:<blockquote>Ler não é apenas decifrar palavras. É dialogar com o texto, questioná-lo, relacioná-lo com o que já se sabe e com o mundo em que se vive.</blockquote>De acordo com o trecho, ler é:`,o:["decifrar corretamente cada palavra","um processo ativo de construção de sentido","uma atividade apenas escolar","aceitar tudo o que o autor diz","memorizar o texto"],a:1,e:`O trecho diz que ler vai além de decifrar palavras: envolve dialogar, questionar e relacionar. Ou seja, o leitor participa ativamente da construção do sentido.`}
],

],
'red-estrutura':[

 {q:`A Competência 2 da redação do ENEM avalia, entre outros aspectos:`,o:["a ortografia e a acentuação","a compreensão do tema e o uso do tipo dissertativo-argumentativo, com repertório pertinente","apenas a quantidade de linhas","a caligrafia do candidato","a proposta de intervenção"],a:1,e:`A C2 avalia se o candidato entendeu a proposta, desenvolveu o tema dentro do tipo dissertativo-argumentativo e usou repertório de outras áreas de forma pertinente.`},
 {q:`Qual opção mostra um repertório sociocultural bem usado num texto sobre desigualdade no acesso à educação?`,o:["Citar a Constituição de 1988, que garante a educação como direito de todos, e mostrar que isso não se cumpre na prática","Citar uma frase famosa sem relação com o tema","Contar uma piada sobre escolas","Copiar trechos dos textos motivadores","Dar a opinião sem nenhum argumento"],a:0,e:`O repertório precisa ter relação com o tema e sustentar o argumento. Citar a Constituição e relacioná-la com a realidade cumpre as duas coisas.`}
],

'ch-escravidao':[
 E(`<p><b>Texto I</b><br>Art. 1º É declarada extincta desde a data desta lei a escravidão no Brazil.<br>Art. 2º Revogam-se as disposições em contrario.</p><p class="fonte">BRASIL. Lei nº 3.353, de 13 de maio de 1888 (Lei Áurea).</p><p><b>Texto II</b><br>Depois da abolição, os libertos não receberam terras, indenizações ou acesso garantido à educação. Muitos continuaram em trabalhos precários, enquanto o Estado incentivava a vinda de imigrantes europeus para as lavouras.</p>`,
  `A comparação entre os textos permite concluir que`,
  ["a Lei Áurea garantiu a plena integração dos libertos à sociedade","a abolição foi um marco jurídico, mas não veio acompanhada de políticas de inclusão para a população negra","a escravidão continuou legal depois de 1888","os imigrantes europeus foram os responsáveis pela abolição","o Estado indenizou os libertos com terras"],1,
  `O Texto I mostra que a lei apenas declarou extinta a escravidão, sem nenhuma outra medida. O Texto II mostra a ausência de políticas para os libertos. Juntos, indicam uma abolição sem inclusão, cujos efeitos aparecem nas desigualdades raciais atuais.`),

],

  `Temperaturas mais altas no centro urbano do que em áreas verdes próximas caracterizam a ilha de calor. Arborizar, criar parques e usar materiais claros ou permeáveis reduz o acúmulo de calor.`),

 {n:`Modernidade líquida`,s:`Zygmunt Bauman, sociólogo polonês (2000)`,i:`Na sociedade atual, as relações, os empregos e os valores são frágeis, rápidos e descartáveis, como um líquido que não mantém a forma.`,u:`"Segundo Zygmunt Bauman, vivemos uma 'modernidade líquida', em que os laços são frágeis e passageiros, o que ajuda a explicar [a solidão / o consumismo / as relações virtuais]."`,t:['Tecnologia','Saúde mental','Juventude','Trabalho']},
 {n:`Sociedade do cansaço`,s:`Byung-Chul Han, filósofo sul-coreano (2010)`,i:`A cobrança constante por desempenho e produtividade faz as pessoas se explorarem até o esgotamento, o que favorece doenças como depressão e burnout.`,u:`"O filósofo Byung-Chul Han descreve a 'sociedade do cansaço', na qual a pressão por desempenho leva ao esgotamento, cenário que se reflete no aumento de [ansiedade/burnout]."`,t:['Saúde mental','Trabalho','Tecnologia','Juventude']},
 {n:`Anomia`,s:`Émile Durkheim, sociólogo francês (fim do século XIX)`,i:`Quando as normas e as instituições sociais perdem força, surge um estado de desorganização, a anomia, que deixa os indivíduos sem referências.`,u:`"Para Émile Durkheim, quando as instituições falham em garantir regras e coesão, instala-se a anomia, o que ajuda a entender [o aumento da violência / a sensação de abandono]."`,t:['Violência','Cidadania','Saúde mental','Juventude']},
 {n:`Banalidade do mal`,s:`Hannah Arendt, Eichmann em Jerusalém (1963)`,i:`Atos terríveis podem ser praticados por pessoas comuns que deixam de refletir e apenas seguem ordens ou o comportamento do grupo.`,u:`"O conceito de 'banalidade do mal', de Hannah Arendt, ajuda a entender como [ataques virtuais / discriminações] se tornam comuns: muitos agem sem refletir sobre as consequências."`,t:['Violência','Tecnologia','Racismo','Cidadania','Mulheres']},

function rngFrom(seed){let a=seed>>>0;return function(){a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296}}
function R(seed){const f=rngFrom(seed);return{f,pick:a=>a[Math.floor(f()*a.length)],int:(a,b)=>a+Math.floor(f()*(b-a+1))}}
function shuffleR(arr,r){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r.f()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

const brl=n=>'R$ '+Number(n).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});

const GMAP=Object.fromEntries(GENS.map(g=>[g.id,g]));
function gerar(g,seed){
  const out=g.f(R(seed)), seen=new Set([out.c]), o=[out.c];
  for(const x of out.d){ if(o.length>=5) break; if(x&&!seen.has(x)){seen.add(x);o.push(x);} }
  for(let k=1;o.length<5&&k<60;k++){ const x=out.x(k); if(x&&!seen.has(x)){seen.add(x);o.push(x);} }
  return {id:`g-${g.id}-${seed}`,q:out.q,o,a:0,e:out.e,topic:TMAP[g.topic],gen:1,m:0};
}
function getQ(id){
  if(QMAP[id]) return QMAP[id];
  const mm=/^g-([a-z]+)-(\d+)$/.exec(id||''); if(!mm||!GMAP[mm[1]]) return null;
  return (QMAP[id]=gerar(GMAP[mm[1]],+mm[2]));
}
function isoDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function hojeStr(){return isoDate(new Date())}
function hojeSeed(){const d=new Date();return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate()}
// Monta a lista de um dia de prova; com a semente do dia, a seleção muda todo dia.
function montarLista(dia,n,seed){
  const r=R(seed*10+dia);
  const banco=shuffleR(ALLQ.filter(q=>DIAS[dia].includes(q.topic.area)).map(q=>q.id),r);
  const nGen=dia===2?Math.ceil(n/2):Math.max(0,n-banco.length);
  const lista=banco.slice(0,Math.min(banco.length,n-nGen));
  const gens=dia===2?GENS:GENS.filter(g=>DIAS[dia].includes(TMAP[g.topic].area));
  for(let k=0;k<nGen&&gens.length;k++){const g=gens[Math.floor(r.f()*gens.length)]; lista.push(`g-${g.id}-${Math.floor(r.f()*1e9)}`);}
  return shuffleR(lista,r);
}

async function buscarPacote(manual){
  const say=t=>{const e=document.getElementById('packStatus'); if(e) e.textContent=t;};
  if(!window.AndroidApp) return;
  if(manual) say('Procurando questões novas...');
  for(const u of PACK_URLS){
    try{
      const ctl=('AbortController' in window)?new AbortController():null, tm=setTimeout(()=>{if(ctl) ctl.abort()},12000);
      const res=await fetch(u+'?t='+Date.now(),{cache:'no-store',signal:ctl?ctl.signal:undefined}); clearTimeout(tm);
      if(!res.ok) continue;
      const p=await res.json(); if(!pacoteValido(p)) continue;
      S.packCheck=Date.now(); save();
      if((p.versao||0)>(PACOTE?PACOTE.versao||0:0)){
        try{localStorage.setItem(PACK_KEY,JSON.stringify(p))}catch(e){}
        mostrarBanner(p);
        if(manual) say(`Chegou a versão ${p.versao} do pacote. Toque em "Atualizar agora".`);
      }else if(manual) say('Você já tem as questões mais recentes.');
      return;
    }catch(e){}
  }
  if(manual) say('Sem conexão com a internet agora. O app continua funcionando com as questões que já tem.');
}
