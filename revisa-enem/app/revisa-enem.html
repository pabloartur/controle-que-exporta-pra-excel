<title>Revisa ENEM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,600..800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
:root{
  /* Layout: coluna única de app (máx. 46rem), telas trocadas pelo #hash; player escuro como tela de aula; alternativas como bolhas do cartão-resposta */
  --paper:#F3F5F9; --card:#FFFFFF; --ink:#141C33; --muted:#566079; --line:#D9DEE8;
  --accent:#2A47C4; --on-accent:#FFFFFF; --mark:#F7DA4A;
  --ok:#17804A; --ok-bg:#E2F3E9; --bad:#C0352B; --bad-bg:#FBE5E2;
  --mt:#2A47C4; --cn:#167A55; --ch:#B45F14; --lc:#A82C67; --red:#6545BE;
  --screen:#111934; --screen-fg:#EDF0F8; --screen-muted:#A9B2CC; --screen-line:rgba(237,240,248,.18); --screen-mark:#FFE16B;
  --f-display:'Archivo','Arial Narrow',system-ui,sans-serif;
  --f-body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0D1220; --card:#151C2F; --ink:#E6E9F2; --muted:#9CA5BE; --line:#283149;
    --accent:#8AA2FF; --on-accent:#0D1220; --mark:rgba(247,218,74,.30);
    --ok:#5DCB8B; --ok-bg:#11301F; --bad:#FF8C80; --bad-bg:#3B1814;
    --mt:#8AA2FF; --cn:#5CC99A; --ch:#EFA45F; --lc:#F07CB2; --red:#B49CFF;
    --screen:#080D1C; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0D1220; --card:#151C2F; --ink:#E6E9F2; --muted:#9CA5BE; --line:#283149;
  --accent:#8AA2FF; --on-accent:#0D1220; --mark:rgba(247,218,74,.30);
  --ok:#5DCB8B; --ok-bg:#11301F; --bad:#FF8C80; --bad-bg:#3B1814;
  --mt:#8AA2FF; --cn:#5CC99A; --ch:#EFA45F; --lc:#F07CB2; --red:#B49CFF;
  --screen:#080D1C; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55;-webkit-tap-highlight-color:transparent}
#app{max-width:46rem;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px 56px;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
p{margin:0}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
mark{background:var(--mark);color:inherit;padding:0 .12em;border-radius:2px}
small{font-size:.8em}

[data-a="mt"]{--ac:var(--mt)} [data-a="cn"]{--ac:var(--cn)} [data-a="ch"]{--ac:var(--ch)} [data-a="lc"]{--ac:var(--lc)} [data-a="red"]{--ac:var(--red)}
.chip{display:inline-flex;align-items:center;justify-content:center;min-width:2.6rem;height:1.7rem;padding:0 .45rem;border:2px solid var(--ac);color:var(--ac);border-radius:6px;font-family:var(--f-display);font-weight:800;font-size:.8rem;letter-spacing:.06em;font-stretch:90%;flex:none}
.chip.big{height:2.1rem;min-width:3.3rem;font-size:.95rem}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:3rem;padding:.6rem 1.15rem;border-radius:10px;border:2px solid var(--accent);background:transparent;color:var(--accent);font:700 1rem/1.2 var(--f-body);text-decoration:none;cursor:pointer;text-align:center}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.ghost{border-color:var(--line);color:var(--muted)}
.back{align-self:flex-start;text-decoration:none;font-weight:700;color:var(--muted);padding:.35rem 0}

/* Início */
.hero{display:flex;flex-direction:column;gap:8px;padding-top:6px}
.eyebrow{font-size:.78rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
.brand{font-size:clamp(2.6rem,9vw,3.6rem);font-weight:800;font-stretch:78%;letter-spacing:-.01em;text-transform:uppercase}
.brand .hl{background:linear-gradient(transparent 58%,var(--mark) 58%,var(--mark) 92%,transparent 92%);padding:0 .08em}
.lede{color:var(--muted);max-width:34rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border:1.5px solid var(--line);border-radius:var(--r);background:var(--card)}
.stats div{display:flex;flex-direction:column;gap:2px;padding:12px 14px;min-width:0}
.stats div+div{border-left:1.5px solid var(--line)}
.stats b{font-family:var(--f-display);font-size:1.7rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.stats b small{font-size:.55em;color:var(--muted);font-weight:700}
.stats span{font-size:.8rem;color:var(--muted);line-height:1.25}
.continue{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:var(--r);background:var(--card);border:1.5px solid var(--line);text-decoration:none;color:var(--ink)}
.continue span:nth-child(2){display:flex;flex-direction:column;min-width:0;flex:1}
.continue small{color:var(--muted)}
.continue strong{font-family:var(--f-display);font-size:1.1rem}
.arrow{font-size:1.4rem;color:var(--accent)}
.quick{display:flex;flex-wrap:wrap;gap:10px}
.quick .btn{flex:1 1 14rem}
.day{display:flex;flex-direction:column;gap:12px}
.day h2{font-size:.85rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:10px}
.day h2::after{content:"";flex:1;height:1.5px;background:var(--line)}
.areas{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:10px}
.area{display:grid;grid-template-columns:auto 1fr;grid-template-areas:"chip name" "chip meta" "bar bar";column-gap:12px;row-gap:2px;align-items:center;padding:14px 16px;border-radius:var(--r);background:var(--card);border:1.5px solid var(--line);text-decoration:none;color:var(--ink)}
.area .chip{grid-area:chip;align-self:start;margin-top:2px}
.aname{grid-area:name;font-family:var(--f-display);font-weight:700;font-size:1.12rem;line-height:1.2}
.ameta{grid-area:meta;font-size:.85rem;color:var(--muted)}
.meter{grid-area:bar;display:block;height:6px;border-radius:3px;background:var(--line);margin-top:10px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--ac);border-radius:3px}
.note{font-size:.88rem;color:var(--muted);border-top:1.5px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:8px}

/* Área */
.ahead{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.ahead h1{font-size:clamp(1.7rem,6vw,2.3rem);font-weight:800;font-stretch:85%}
.exam{color:var(--muted)}
.topics{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.topic{display:flex;flex-direction:column;gap:6px;padding:16px;border-radius:var(--r);background:var(--card);border:1.5px solid var(--line);text-decoration:none;color:var(--ink)}
.topic strong{font-family:var(--f-display);font-size:1.15rem}
.topic .why{color:var(--muted);font-size:.92rem}
.tstat{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:.78rem;font-weight:700;padding:2px 9px;border-radius:99px;border:1.5px solid var(--line);color:var(--muted)}
.pill.ok{border-color:var(--ok);color:var(--ok)}

/* Aula */
.thead{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.thead h1{font-size:clamp(1.6rem,6vw,2.2rem);font-weight:800;font-stretch:85%}
.thead .why{color:var(--muted)}
.player{display:flex;flex-direction:column;gap:10px}
.screen{background:var(--screen);color:var(--screen-fg);border-radius:var(--r);padding:16px 18px 22px;min-height:17rem;display:flex;flex-direction:column;gap:12px;overflow:hidden}
.scr-top{display:flex;justify-content:space-between;gap:10px;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--screen-muted);font-weight:700}
.slide{display:flex;flex-direction:column;gap:12px;flex:1;justify-content:center}
.slide.enter{animation:enter .28s ease-out}
@keyframes enter{from{opacity:.25;transform:translateY(6px)}to{opacity:1;transform:none}}
.slide h2{font-size:clamp(1.35rem,4.8vw,1.75rem);font-weight:800;font-stretch:88%;color:var(--screen-fg)}
.sbody{font-size:1.05rem;line-height:1.6}
.screen mark{background:transparent;color:var(--screen-mark);box-shadow:inset 0 -.38em 0 rgba(255,225,107,.18);padding:0}
.screen small{color:var(--screen-muted)}
.f{margin:.6em 0;padding:.6em .8em;border:1.5px dashed var(--line);border-radius:8px;font-variant-numeric:tabular-nums;font-weight:700;line-height:1.5;overflow-x:auto}
.screen .f{border-color:var(--screen-line);color:var(--screen-fg)}
.endcard{display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.endcard .btn{background:var(--screen-mark);border-color:var(--screen-mark);color:#141C33}
.segs{display:flex;gap:5px}
.seg{flex:1;height:22px;padding:8px 0;border:0;background:transparent;cursor:pointer}
.seg i{display:block;height:6px;border-radius:3px;background:var(--line);position:relative;overflow:hidden}
.seg i::after{content:"";position:absolute;inset:0;width:var(--p,0%);background:var(--accent);border-radius:3px;transition:width .4s linear}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ctl{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;min-height:3rem;min-width:3rem;padding:.4rem .9rem;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:700 .95rem/1 var(--f-body);cursor:pointer}
.ctl svg{width:1.15rem;height:1.15rem;fill:currentColor;flex:none}
.ctl.play{background:var(--accent);border-color:var(--accent);color:var(--on-accent);flex:1 1 9rem}
.ctl:disabled{opacity:.4;cursor:default}
.ctl[aria-pressed="true"]{color:var(--muted)}
.hint{font-size:.85rem;color:var(--muted)}
.next-step{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.next-step .status{font-size:.9rem;color:var(--muted)}
.resumo{border-top:1.5px solid var(--line);padding-top:6px}
.resumo summary{cursor:pointer;font-weight:700;padding:.6rem 0;color:var(--accent)}
.resumo .rs{display:flex;flex-direction:column;gap:6px;padding:10px 0}
.resumo h3{font-size:1.05rem;margin-top:8px}
.resumo small{color:var(--muted)}

/* Questões */
.qhead{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;font-size:.9rem;color:var(--muted)}
.qhead .count{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:700}
.qbar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.qbar i{display:block;height:100%;background:var(--accent)}
.question{display:flex;flex-direction:column;gap:16px}
.enun{font-size:1.06rem}
blockquote{margin:.7em 0;padding:.5em 0 .5em 1em;border-left:3px solid var(--line);color:var(--ink);font-style:italic}
.opts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.opt:disabled{cursor:default}
.bub{flex:none;width:2rem;height:2rem;border-radius:50%;border:2px solid var(--muted);display:inline-flex;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:800;font-size:.9rem;color:var(--muted)}
.otext{padding-top:.2rem;min-width:0}
.opt.is-right{border-color:var(--ok);background:var(--ok-bg)}
.opt.is-right .bub{background:var(--ok);border-color:var(--ok);color:var(--card)}
.opt.is-wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.is-wrong .bub{background:var(--bad);border-color:var(--bad);color:var(--card)}
.fb{padding:14px 16px;border-radius:10px;border:1.5px solid;display:flex;flex-direction:column;gap:8px}
.fb.ok{border-color:var(--ok);background:var(--ok-bg)}
.fb.bad{border-color:var(--bad);background:var(--bad-bg)}
.fb strong{font-family:var(--f-display);font-size:1.15rem}
.fb.ok strong{color:var(--ok)} .fb.bad strong{color:var(--bad)}
.feedback{display:flex;flex-direction:column;gap:12px}

/* Resultado */
.score{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.score .big{font-family:var(--f-display);font-size:clamp(3rem,14vw,4.4rem);font-weight:800;font-stretch:80%;line-height:1;font-variant-numeric:tabular-nums}
.score .big small{font-size:.45em;color:var(--muted)}
.sheet{display:flex;flex-wrap:wrap;gap:8px;padding:14px;border:1.5px dashed var(--line);border-radius:var(--r);background:var(--card)}
.sheet span{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.sheet b{width:1.9rem;height:1.9rem;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-family:var(--f-display);font-size:.85rem;color:var(--card)}
.sheet .r b{background:var(--ok)} .sheet .w b{background:var(--bad)}
.review{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.review li{padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);display:flex;flex-direction:column;gap:4px}
.review .meta{font-size:.85rem;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.actions .btn{flex:1 1 12rem}
.empty{padding:22px;border-radius:var(--r);border:1.5px dashed var(--line);display:flex;flex-direction:column;gap:12px;align-items:flex-start}

/* Barra do tema e da conexão */
.topbar{max-width:46rem;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 0;display:flex;justify-content:space-between;align-items:center;gap:10px}
.net{font-size:.8rem;font-weight:700;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.net i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.net.on i{background:var(--ok)}
.bannerwrap{max-width:46rem;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 0}
.banner{padding:12px 16px;border-radius:var(--r);background:var(--ok-bg);border:1.5px solid var(--ok);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 14px}

/* Treino por dia de prova */
.treino{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--card)}
.treino h2{font-size:1.3rem;font-weight:800;font-stretch:88%}
.opcoes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.opcoes.n3{grid-template-columns:repeat(3,minmax(0,1fr))}
.opb{display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-height:3.2rem;padding:.6rem .8rem;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);font:800 1.05rem/1.2 var(--f-display);cursor:pointer;text-align:left}
.opb small{font:400 .78rem/1.3 var(--f-body);color:var(--muted)}
.opcoes.n3 .opb{align-items:center;text-align:center}
.opb[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent);color:var(--accent)}
.hojeinfo{font-size:.88rem;color:var(--muted)}
.online{display:flex;flex-direction:column;gap:8px;align-items:flex-start;padding:16px;border-radius:var(--r);border:1.5px dashed var(--line)}
.themebtn{display:inline-flex;align-items:center;gap:.45rem;min-height:2.6rem;padding:.3rem .9rem;border-radius:99px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:700 .85rem/1 var(--f-body);cursor:pointer}
.themebtn svg{width:1.05rem;height:1.05rem;fill:currentColor}

/* Questões modelo ENEM */
.tb{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;font-size:.98rem;min-width:0}
.tb p{margin:0}
.tb .fonte{font-size:.78rem;color:var(--muted);text-align:right}
.tbwrap{overflow-x:auto}
.tb table{border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.92rem}
.tb th,.tb td{border:1px solid var(--line);padding:5px 10px;text-align:center}
.tb th{font-weight:700}
.cmd{font-weight:700;margin-top:12px}
.tag{display:inline-block;font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:5px;background:var(--mark);color:var(--ink)}
.timer{font-variant-numeric:tabular-nums;font-weight:700}

/* Repertório curinga */
.filters{display:flex;flex-wrap:wrap;gap:6px}
.fchip{min-height:2.3rem;padding:.25rem .85rem;border-radius:99px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:700 .85rem/1 var(--f-body);cursor:pointer}
.fchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.rep{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.rcard{padding:16px;border-radius:var(--r);background:var(--card);border:1.5px solid var(--line);display:flex;flex-direction:column;gap:8px}
.rcard h3{font-size:1.15rem}
.rsrc{font-size:.85rem;color:var(--muted)}
.ruse{border-left:3px solid var(--accent);padding-left:12px;font-style:italic}
.rtags{display:flex;flex-wrap:wrap;gap:6px}
.rtags span{font-size:.75rem;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:1px 9px}
.rcount{font-size:.88rem;color:var(--muted)}

/* Videoaulas e SmartTube */
.sec{font-family:var(--f-body);font-size:.85rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700}
.videos{display:flex;flex-direction:column;gap:10px}
.video{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r);background:var(--card);border:1.5px solid var(--line);text-decoration:none;color:var(--ink)}
.vplay{flex:none;width:2.6rem;height:2.6rem;border-radius:10px;background:var(--accent);color:var(--on-accent);display:inline-flex;align-items:center;justify-content:center}
.vplay svg{width:1.1rem;height:1.1rem;fill:currentColor}
.vtext{display:flex;flex-direction:column;min-width:0}
.vtext strong{line-height:1.3}
.vtext small{color:var(--muted)}
.vfoot{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.92rem}
.vfoot a{font-weight:700}
.steps{margin:0;padding-left:1.5rem;display:flex;flex-direction:column;gap:14px}
.steps li::marker{font-family:var(--f-display);font-weight:800;color:var(--accent)}
.path{font-weight:700;background:var(--card);border:1px solid var(--line);border-radius:5px;padding:0 .3em}
.warn{padding:14px 16px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);display:flex;flex-direction:column;gap:6px}
@media (max-width:520px){ .ctl.play{flex-basis:100%;order:-1} .controls .ctl:not(.play){flex:1 1 auto} }
@media (min-width:700px){ body{font-size:18px} .screen{min-height:19rem;padding:22px 26px 28px} }
@media (prefers-reduced-motion:reduce){ .slide.enter{animation:none} .seg i::after{transition:none} }
</style>

<div class="topbar"><span class="net" id="netInfo"></span><button class="themebtn" id="themeBtn" type="button"></button></div>

<main id="app"></main>

<script>window.PACOTE_EMBUTIDO=/*PACOTE*/{"versao":1,"atualizado":"2026-11-09","descricao":"Pacote de questões extras do app Revisa ENEM. Para publicar questões novas, acrescente itens em \"questoes\" e aumente \"versao\".","questoes":[{"id":"p1-lc-funcoes-1","topic":"lc-funcoes","q":"<div class=\"tb\"><p>Atenção, passageiros do voo 2041 com destino a Recife: o embarque será realizado no portão 12, a partir das 14h30. Tenham em mãos um documento com foto e o cartão de embarque.<\/p><\/div><p class=\"cmd\">Nesse aviso predomina a função referencial, mas há também traços da função conativa, identificados<\/p>","o":["no vocativo 'passageiros' e no verbo no imperativo 'tenham'","na descrição dos sentimentos de quem fala","no uso de rimas e de ritmo","na explicação do significado das palavras","no teste do canal de comunicação"],"a":0,"e":"O aviso informa horário e portão (função referencial), mas também se dirige diretamente ao público com vocativo (\"Atenção, passageiros\") e verbo no imperativo (\"Tenham\"), marcas da função conativa.","m":1},{"id":"p1-lc-funcoes-2","topic":"lc-funcoes","q":"<div class=\"tb\"><p>Neste blog, escrevo sobre o que é escrever. Cada post é uma tentativa de entender por que algumas palavras chegam fácil e outras se escondem até o último parágrafo.<\/p><\/div><p class=\"cmd\">A função da linguagem que predomina nesse trecho é a<\/p>","o":["referencial","fática","metalinguística","conativa","poética"],"a":2,"e":"O texto fala sobre o próprio ato de escrever: é a linguagem voltada para si mesma, marca da função metalinguística.","m":1},{"id":"p1-lc-variacao-1","topic":"lc-variacao","q":"<div class=\"tb\"><p>Em um grupo de mensagens da família, a avó escreveu: \"Meus queridos netos, que alegria receber a visita de vocês!\". O neto respondeu: \"vlw, vó, foi top demais!\".<\/p><\/div><p class=\"cmd\">As diferenças entre as duas mensagens evidenciam principalmente a variação<\/p>","o":["regional, pois avó e neto moram em estados diferentes","social, ligada à faixa etária dos falantes","histórica, pois a avó usa palavras que já não existem","situacional, pois cada um escreveu em um aplicativo diferente","nenhuma, pois as duas mensagens seguem a norma-padrão"],"a":1,"e":"Abreviações como \"vlw\" e gírias como \"top\" são típicas da linguagem dos mais jovens. A diferença de geração entre avó e neto mostra a variação social ligada à idade.","m":1},{"id":"p1-lc-variacao-2","topic":"lc-variacao","q":"<div class=\"tb\"><p>Em uma propaganda de banco, um personagem diz: \"Abrir conta com a gente é mamão com açúcar\". Logo depois, aparece na tela: \"Consulte as condições no contrato\".<\/p><\/div><p class=\"cmd\">O uso da expressão popular \"mamão com açúcar\" na propaganda tem como objetivo<\/p>","o":["aproximar o banco do público, com uma linguagem informal e descontraída","mostrar que o banco desconhece a norma-padrão","informar as condições do contrato com precisão técnica","criticar o uso de expressões populares","indicar que a conta é só para produtores de frutas"],"a":0,"e":"A expressão popular, que significa \"algo fácil\", cria simpatia e proximidade com o público. Já o aviso sobre o contrato usa linguagem formal, adequada a uma informação legal.","m":1},{"id":"p1-lc-generos-1","topic":"lc-generos","q":"<div class=\"tb\"><p>É inadmissível que, em pleno século XXI, tantas escolas ainda não tenham acesso à internet. Sem conexão, os estudantes ficam excluídos de oportunidades que já são básicas. Investir em infraestrutura digital não é luxo: é garantir o direito à educação.<\/p><\/div><p class=\"cmd\">O trecho apresenta características do gênero artigo de opinião porque<\/p>","o":["defende um ponto de vista e usa argumentos para convencer o leitor","narra uma história com personagens e conflito","apresenta instruções passo a passo","descreve objetos de forma neutra","registra fatos de forma impessoal, sem opinião"],"a":0,"e":"Expressões como \"é inadmissível\" e \"não é luxo: é garantir\" mostram que o autor defende uma posição e argumenta a favor dela, marcas do artigo de opinião.","m":1},{"id":"p1-lc-generos-2","topic":"lc-generos","q":"<div class=\"tb\"><p>Em uma tirinha, no primeiro quadrinho, um menino diz à mãe: \"Hoje vou estudar o dia inteiro!\". No segundo, ele aparece cercado de livros. No terceiro, está dormindo sobre os livros, e a mãe comenta: \"Pelo menos os livros estão bem perto da cabeça.\"<\/p><\/div><p class=\"cmd\">O humor da tirinha é construído principalmente<\/p>","o":["pela quebra de expectativa entre a promessa do menino e o que ele de fato faz","pela crítica ao excesso de livros nas escolas","pela descrição objetiva de uma rotina de estudos","pelo uso de linguagem técnica","pela falta de relação entre os quadrinhos"],"a":0,"e":"O menino promete estudar o dia todo, mas acaba dormindo. O comentário irônico da mãe reforça essa quebra de expectativa, que gera o humor.","m":1},{"id":"p1-lc-figuras-1","topic":"lc-figuras","q":"<div class=\"tb\"><p>Aquela notícia caiu como uma bomba na cidade.<\/p><\/div><p class=\"cmd\">Na frase, a expressão \"caiu como uma bomba\" constitui uma<\/p>","o":["comparação, que reforça o impacto causado pela notícia","eufemismo, que suaviza a notícia","metonímia, que troca o autor pela obra","onomatopeia, que imita o som de uma explosão","antítese, que opõe ideias contrárias"],"a":0,"e":"Há uma comparação explícita, com o conectivo \"como\", entre a notícia e uma bomba, para destacar o choque que ela provocou.","m":1},{"id":"p1-lc-figuras-2","topic":"lc-figuras","q":"<div class=\"tb\"><p>O Brasil inteiro parou para assistir à final do campeonato.<\/p><\/div><p class=\"cmd\">A expressão \"o Brasil inteiro\" é um exemplo de<\/p>","o":["metonímia, pois o nome do país representa as pessoas que vivem nele","personificação, pois o país ganha sentimentos humanos","ironia, pois diz o contrário do que se pensa","eufemismo, pois suaviza um fato desagradável","antítese, pois opõe ideias contrárias"],"a":0,"e":"O nome do país é usado no lugar dos brasileiros, por uma relação de proximidade (o lugar pelos seus habitantes): metonímia. Há também um exagero, já que nem todos pararam de fato.","m":1},{"id":"p1-ch-escravidao-1","topic":"ch-escravidao","q":"<div class=\"tb\"><p>Os africanos escravizados trazidos ao Brasil vinham de diferentes povos e regiões, como a África Centro-Ocidental e o Golfo do Benim. Trouxeram línguas, religiões, técnicas de trabalho e saberes que marcaram profundamente a cultura brasileira, da culinária à música.<\/p><\/div><p class=\"cmd\">O texto destaca que a presença africana no Brasil<\/p>","o":["foi homogênea, pois todos vinham de um mesmo povo","deixou contribuições diversas e fundamentais para a formação cultural brasileira","limitou-se ao trabalho nas lavouras, sem influência cultural","desapareceu depois da abolição","foi menor que a de qualquer outro país das Américas"],"a":1,"e":"O texto ressalta a diversidade de origens e as muitas contribuições, como línguas, religiões, técnicas, culinária e música. Ao contrário da última alternativa, o Brasil foi o maior destino de africanos escravizados nas Américas.","m":1},{"id":"p1-ch-escravidao-2","topic":"ch-escravidao","q":"<div class=\"tb\"><p>O tráfico negreiro foi uma das atividades mais lucrativas do mundo atlântico. Comerciantes enriqueciam com a compra e a venda de pessoas, e a mão de obra escravizada sustentava a produção de açúcar, de ouro e, mais tarde, de café.<\/p><\/div><p class=\"cmd\">De acordo com o texto, a escravidão no Brasil esteve diretamente ligada<\/p>","o":["às necessidades da economia colonial e aos lucros do comércio atlântico","à falta de terras para o cultivo","ao desenvolvimento da indústria no século XVI","à vontade dos africanos de migrar para a América","à proibição do trabalho indígena desde 1500"],"a":0,"e":"O texto mostra que a escravidão era a base da produção (açúcar, ouro e café) e que o próprio tráfico gerava grandes lucros: ela estava no centro da economia colonial.","m":1},{"id":"p1-ch-republica-1","topic":"ch-republica","q":"<div class=\"tb\"><p>Em 1964, um golpe civil-militar depôs o presidente João Goulart, que defendia as chamadas reformas de base, como a reforma agrária. Setores empresariais, parte da imprensa, da Igreja e da classe média apoiaram o golpe, temendo o avanço do comunismo.<\/p><\/div><p class=\"cmd\">O contexto descrito relaciona o golpe de 1964<\/p>","o":["ao clima da Guerra Fria e à oposição às reformas propostas por Goulart","ao fim da escravidão","à Revolução de 1930","à redemocratização de 1985","ao apoio unânime da população às reformas de base"],"a":0,"e":"O golpe aconteceu em plena Guerra Fria. Grupos conservadores, com medo do comunismo, se opuseram às reformas de base de Goulart e apoiaram sua deposição.","m":1},{"id":"p1-ch-republica-2","topic":"ch-republica","q":"<div class=\"tb\"><p>A Constituição de 1988 ficou conhecida como \"Constituição Cidadã\". Ela ampliou direitos sociais, garantiu eleições diretas, instituiu o Sistema Único de Saúde (SUS) e definiu o racismo como crime inafiançável e imprescritível.<\/p><\/div><p class=\"cmd\">O apelido \"Constituição Cidadã\" se justifica porque o documento<\/p>","o":["ampliou direitos e garantias depois de um período autoritário","manteve os Atos Institucionais do regime militar","proibiu o voto dos analfabetos","restringiu a liberdade de imprensa","reduziu os direitos trabalhistas"],"a":0,"e":"Promulgada depois da ditadura, a Constituição de 1988 ampliou direitos sociais e políticos. Ela também garantiu o voto facultativo aos analfabetos, em vez de proibi-lo.","m":1},{"id":"p1-ch-geografia-1","topic":"ch-geografia","q":"<div class=\"tb\"><p>Em muitas cidades brasileiras, os bairros centrais concentram empregos, transporte e serviços, enquanto grande parte dos trabalhadores mora em periferias distantes. O resultado são viagens diárias de duas a quatro horas entre a casa e o trabalho.<\/p><\/div><p class=\"cmd\">A situação descrita é uma consequência<\/p>","o":["da segregação socioespacial e da concentração de empregos nas áreas centrais","da distribuição igualitária da população pela cidade","do excesso de transporte público nas periferias","da falta de empregos nas áreas centrais","do êxodo urbano em direção ao campo"],"a":0,"e":"Os empregos ficam no centro, mas os trabalhadores de baixa renda moram longe, onde a moradia é mais barata. Essa separação, a segregação socioespacial, gera longos deslocamentos.","m":1},{"id":"p1-ch-geografia-2","topic":"ch-geografia","q":"<div class=\"tb\"><p>Em 2023, uma seca severa na Amazônia deixou rios em níveis muito baixos, isolou comunidades ribeirinhas e prejudicou o transporte e o abastecimento. Especialistas relacionaram o evento ao fenômeno El Niño e ao aquecimento global.<\/p><\/div><p class=\"cmd\">O texto mostra que eventos climáticos extremos<\/p>","o":["atingem de forma mais intensa as populações que dependem diretamente dos rios","não têm nenhuma relação com atividades humanas","atingem igualmente todas as regiões e grupos sociais","só acontecem em áreas urbanas","melhoram o transporte fluvial na região"],"a":0,"e":"As comunidades ribeirinhas dependem dos rios para transporte, alimentação e abastecimento, por isso a seca extrema as atinge de forma mais grave. O texto também relaciona o evento ao aquecimento global, ligado a atividades humanas.","m":1},{"id":"p1-ch-filosofia-1","topic":"ch-filosofia","q":"<div class=\"tb\"><p>O homem nasce livre, e por toda parte encontra-se a ferros.<\/p><span class=\"fonte\">ROUSSEAU, J.-J. Do contrato social (1762). Tradução livre.<\/span><\/div><p class=\"cmd\">Nessa frase, o autor critica<\/p>","o":["as instituições sociais que limitam a liberdade natural do ser humano","a ideia de que todos nascem iguais","a vontade geral do povo","a educação das crianças","a existência de leis naturais"],"a":0,"e":"Para Rousseau, o ser humano nasce livre, mas a sociedade organizada de forma injusta o aprisiona. Ele propõe um novo contrato social, baseado na vontade geral, para recuperar essa liberdade.","m":1},{"id":"p1-ch-filosofia-2","topic":"ch-filosofia","q":"<div class=\"tb\"><p>Para o sociólogo Max Weber, a sociedade moderna passou por um processo de racionalização: cada vez mais, as ações são guiadas pelo cálculo, pela eficiência e por regras impessoais, como nas empresas e na burocracia do Estado.<\/p><\/div><p class=\"cmd\">Um exemplo atual do processo descrito é<\/p>","o":["a organização de um serviço público por meio de protocolos, senhas e regras iguais para todos","a escolha de um líder por suas qualidades extraordinárias","a obediência a um costume só porque sempre foi assim","a decisão de um juiz baseada apenas em seu sentimento pessoal","a organização de uma festa popular sem nenhuma regra"],"a":0,"e":"Protocolos, senhas e regras impessoais mostram a racionalização e a dominação racional-legal. Seguir um líder pelas qualidades dele é a dominação carismática; obedecer ao costume é a tradicional.","m":1},{"id":"p1-red-estrutura-1","topic":"red-estrutura","q":"<div class=\"tb\"><p>Trecho de redação: \"Além disso, o abandono de idosos se agrava pela falta de políticas públicas. Prova disso é que muitos municípios não oferecem centros de convivência para essa população. Dessa forma, o isolamento social se torna regra, e não exceção.\"<\/p><\/div><p class=\"cmd\">No trecho, as expressões \"Além disso\", \"Prova disso\" e \"Dessa forma\" contribuem principalmente para<\/p>","o":["a coesão, ao ligar as ideias e indicar adição, comprovação e conclusão","a proposta de intervenção","o repertório sociocultural","a fuga ao tema","a ortografia do texto"],"a":0,"e":"Esses conectivos ligam frases e ideias: \"além disso\" acrescenta, \"prova disso\" introduz uma comprovação e \"dessa forma\" conclui. Isso é avaliado na Competência 4, a da coesão.","m":1},{"id":"p1-red-estrutura-2","topic":"red-estrutura","q":"<div class=\"tb\"><p><b>Tema:<\/b> Desafios para a valorização de comunidades e povos tradicionais no Brasil.<\/p><p>Um candidato escreveu um texto sobre a importância da preservação ambiental em geral, sem mencionar comunidades ou povos tradicionais.<\/p><\/div><p class=\"cmd\">De acordo com os critérios do ENEM, esse texto corre o risco de<\/p>","o":["tangenciar o tema, por tratar o assunto de forma genérica e deixar de lado o núcleo da proposta","receber a nota máxima na Competência 2","ser considerado um texto exemplar","ganhar pontos extras por tratar de meio ambiente","ser avaliado apenas na Competência 1"],"a":0,"e":"O núcleo do tema são as comunidades e os povos tradicionais. Falar só de meio ambiente em geral é tangenciar o tema, o que reduz muito a nota. Se o texto não tivesse nenhuma relação com a proposta, seria fuga total, que zera a redação.","m":1},{"id":"p1-red-intervencao-1","topic":"red-intervencao","q":"<div class=\"tb\"><p>Proposta: \"Logo, o Ministério da Saúde, em parceria com as escolas, deve promover rodas de conversa sobre saúde mental, conduzidas por psicólogos da rede pública, a fim de reduzir o estigma em torno do tema entre os jovens.\"<\/p><\/div><p class=\"cmd\">No trecho, a expressão \"conduzidas por psicólogos da rede pública\" corresponde ao elemento<\/p>","o":["detalhamento","agente","finalidade","ação","tema"],"a":0,"e":"A expressão dá mais informação sobre a ação (as rodas de conversa), dizendo quem vai conduzi-las: é o detalhamento. O agente é o Ministério da Saúde, e a finalidade é reduzir o estigma.","m":1},{"id":"p1-red-intervencao-2","topic":"red-intervencao","q":"<div class=\"tb\"><p><b>Proposta A:<\/b> \"O governo deve fazer campanhas.\"<\/p><p><b>Proposta B:<\/b> \"O Ministério da Educação deve criar campanhas nas redes sociais e nas escolas, com depoimentos de jovens que superaram a evasão escolar, para mostrar a importância de concluir o ensino médio.\"<\/p><\/div><p class=\"cmd\">A proposta B é mais adequada aos critérios do ENEM porque<\/p>","o":["apresenta agente específico, ação, meio, detalhamento e finalidade","é mais curta e mais direta","não indica quem vai agir","usa linguagem informal","dispensa a relação com o tema"],"a":0,"e":"A proposta B traz agente (Ministério da Educação), ação (criar campanhas), meio (redes sociais e escolas), detalhamento (depoimentos de jovens) e finalidade (mostrar a importância de concluir o ensino médio). A proposta A é vaga.","m":1}]}/*FIM*/;</script>
